name: Validate article prompt content
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/sync_hotel_prompts.py --check
      - run: python3 -m unittest discover -s tests -p 'test_prompt_content.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_prompt_copy.cjs
