name: Build Yamazumi social preview PNG
on:
  push:
    paths:
      - '.github/workflows/yamazumi-social-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Render social image from Banner A
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO
          src='assets/series-banners/yamazumi-tourism-banner-a.svg'
          out='assets/series-banners/yamazumi-tourism-social-1200x630.png'
          png=cairosvg.svg2png(url=src,output_width=1200,output_height=330)
          art=Image.open(BytesIO(png)).convert('RGB')
          canvas=Image.new('RGB',(1200,630),'#092f4d')
          canvas.paste(art,(0,150))
          canvas.save(out,optimize=True)
          print('Wrote',out)
          PY
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/series-banners/yamazumi-tourism-social-1200x630.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG social preview for Yamazumi article"
            git push origin HEAD:master
          fi
