name: Check article video availability
on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * 1'
permissions:
  contents: read
jobs:
  check-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check placements and public video availability
        run: python3 scripts/check_article_videos.py --online --report /tmp/article-video-status.json
      - name: Save video status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-video-status
          path: /tmp/article-video-status.json
