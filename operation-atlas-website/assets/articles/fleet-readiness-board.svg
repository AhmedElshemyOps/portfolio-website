<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title"><title id="title">Fleet readiness board</title><rect width="1600" height="800" fill="#f6f8fb"/><rect x="55" y="48" width="1490" height="704" rx="28" fill="#fff" stroke="#d9e4ef" stroke-width="4"/><text x="105" y="115" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#07182d">Fleet Readiness Board</text><text x="105" y="158" font-family="Arial,sans-serif" font-size="22" fill="#5c6d7f">Available is not enough. Check comfort, safety, compliance and service suitability.</text><g font-family="Arial,sans-serif"><g transform="translate(105 205)"><rect width="320" height="440" rx="20" fill="#eefbf3" stroke="#42a96b" stroke-width="4"/><text x="28" y="55" font-size="26" font-weight="700" fill="#14643b">GOOD TO GO</text><text x="28" y="103" font-size="24" font-weight="700" fill="#07182d">SUV-12 • Family transfer</text><text x="28" y="150" font-size="20" fill="#31465d">✓ AC &amp; comfort ready</text><text x="28" y="190" font-size="20" fill="#31465d">✓ Child seats confirmed</text><text x="28" y="230" font-size="20" fill="#31465d">✓ Driver acknowledged</text><text x="28" y="270" font-size="20" fill="#31465d">✓ Luggage capacity fit</text><text x="28" y="335" font-size="19" fill="#14643b">Guest service: 07:30 AUH arrival</text></g><g transform="translate(470 205)"><rect width="320" height="440" rx="20" fill="#fff8e4" stroke="#d5a42d" stroke-width="4"/><text x="28" y="55" font-size="26" font-weight="700" fill="#895f00">READY WITH NOTE</text><text x="28" y="103" font-size="24" font-weight="700" fill="#07182d">COACH-04 • City tour</text><text x="28" y="150" font-size="20" fill="#31465d">✓ Documents valid</text><text x="28" y="190" font-size="20" fill="#31465d">✓ Vehicle cleaned</text><text x="28" y="230" font-size="20" fill="#31465d">! AC inspection after service</text><text x="28" y="270" font-size="20" fill="#31465d">✓ Guide contact confirmed</text><text x="28" y="335" font-size="19" fill="#895f00">Action: create maintenance follow-up</text></g><g transform="translate(835 205)"><rect width="320" height="440" rx="20" fill="#fff0f0" stroke="#d45151" stroke-width="4"/><text x="28" y="55" font-size="26" font-weight="700" fill="#a32929">RESTRICTED</text><text x="28" y="103" font-size="24" font-weight="700" fill="#07182d">SEDAN-07 • VIP transfer</text><text x="28" y="150" font-size="20" fill="#31465d">✓ Driver available</text><text x="28" y="190" font-size="20" fill="#31465d">! Premium standard not met</text><text x="28" y="230" font-size="20" fill="#31465d">! Interior inspection needed</text><text x="28" y="270" font-size="20" fill="#31465d">✕ Do not assign to VIP</text><text x="28" y="335" font-size="19" fill="#a32929">Action: substitute or repair</text></g><g transform="translate(1200 205)"><rect width="260" height="440" rx="20" fill="#eff3f8" stroke="#74859a" stroke-width="4"/><text x="28" y="55" font-size="25" font-weight="700" fill="#4b5a6e">MAINTENANCE HOLD</text><text x="28" y="103" font-size="24" font-weight="700" fill="#07182d">SUV-21</text><text x="28" y="150" font-size="20" fill="#31465d">Technical defect</text><text x="28" y="190" font-size="20" fill="#31465d">No active service</text><text x="28" y="230" font-size="20" fill="#31465d">Maintenance owner</text><text x="28" y="270" font-size="20" fill="#31465d">Return-to-service check</text></g></g></svg>