<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">SCOPE BOUNDARY</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Inclusions and exclusions define the service promise</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Specific wording prevents optional items, supplier conditions and guest</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">responsibilities from becoming accidental commitments.</text><rect x="70" y="300" width="570" height="370" rx="24" fill="#071A32" stroke="#C79A43" stroke-width="4"/><text x="110" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#DFC27D" text-anchor="start">CONFIRMED INCLUSIONS</text><text x="120" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Named service + quantity</text><text x="120" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Timing or duration</text><text x="120" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Delivery condition</text><text x="120" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Responsible supplier or team</text><rect x="760" y="300" width="570" height="370" rx="24" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="800" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#071A32" text-anchor="start">EXCLUSIONS + OPTIONS</text><text x="810" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Not included in price</text><text x="810" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Guest or client responsibility</text><text x="810" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Optional item + approval route</text><text x="810" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Condition that can change cost</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · QUOTATION APPLICATION</text></svg>
