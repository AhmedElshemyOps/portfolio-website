<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">72 hour DMC assignment workflow</title><desc id="desc">A three-stage workflow showing initial planning, 24 hour confirmation, and live-day control for DMC operations assignments.</desc>
<rect width="1600" height="720" fill="#f5f9fc"/><text x="800" y="84" text-anchor="middle" fill="#071527" font-family="Arial,sans-serif" font-size="42" font-weight="700">DMC Assignment Workflow: Plan Early, Confirm Clearly, Control Exceptions</text>
<g font-family="Arial,sans-serif"><g transform="translate(95 175)"><rect width="410" height="420" rx="30" fill="#0c3152"/><circle cx="62" cy="62" r="34" fill="#f3c765"/><text x="62" y="72" text-anchor="middle" fill="#071527" font-size="24" font-weight="700">72</text><text x="110" y="72" fill="#fff" font-size="30" font-weight="700">HOURS BEFORE</text><text x="42" y="150" fill="#b9d9ed" font-size="21">Review bookings, profiles, routes,</text><text x="42" y="187" fill="#b9d9ed" font-size="21">languages, special requests, vehicle</text><text x="42" y="224" fill="#b9d9ed" font-size="21">needs, team availability and risk.</text><rect x="42" y="282" width="326" height="78" rx="18" fill="#fff"/><text x="205" y="328" text-anchor="middle" fill="#071527" font-size="24" font-weight="700">Select primary + backup</text></g><g transform="translate(595 175)"><rect width="410" height="420" rx="30" fill="#123d60"/><circle cx="62" cy="62" r="34" fill="#a9d6ee"/><text x="62" y="72" text-anchor="middle" fill="#071527" font-size="22" font-weight="700">24</text><text x="110" y="72" fill="#fff" font-size="30" font-weight="700">HOURS BEFORE</text><text x="42" y="150" fill="#d6ebf7" font-size="21">Confirm people, vehicle, tickets,</text><text x="42" y="187" fill="#d6ebf7" font-size="21">suppliers, final count, briefings</text><text x="42" y="224" fill="#d6ebf7" font-size="21">and guest communication.</text><rect x="42" y="282" width="326" height="78" rx="18" fill="#fff"/><text x="205" y="328" text-anchor="middle" fill="#071527" font-size="24" font-weight="700">Confirm acceptance + readiness</text></g><g transform="translate(1095 175)"><rect width="410" height="420" rx="30" fill="#174c70"/><circle cx="62" cy="62" r="34" fill="#71d6a0"/><text x="62" y="72" text-anchor="middle" fill="#071527" font-size="21" font-weight="700">LIVE</text><text x="110" y="72" fill="#fff" font-size="30" font-weight="700">DAY CONTROL</text><text x="42" y="150" fill="#d6ebf7" font-size="21">Track only exceptions: pickup, guest</text><text x="42" y="187" fill="#d6ebf7" font-size="21">collection, delays, incidents and</text><text x="42" y="224" fill="#d6ebf7" font-size="21">safe service completion.</text><rect x="42" y="282" width="326" height="78" rx="18" fill="#fff"/><text x="205" y="328" text-anchor="middle" fill="#071527" font-size="24" font-weight="700">Escalate, recover, record</text></g></g>
<g fill="none" stroke="#f3c765" stroke-width="8" stroke-linecap="round"><path d="M515 385h55"/><path d="M1015 385h55"/></g><g fill="#f3c765"><path d="M570 385l-18-12v24z"/><path d="M1070 385l-18-12v24z"/></g><text x="800" y="665" text-anchor="middle" fill="#526a81" font-family="Arial,sans-serif" font-size="24">A professional operation is prepared before the guest arrives—and only exception decisions need live management.</text>
</svg>