<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Rolling twelve-month operating calendar</title><desc id="desc">The September 2026 to August 2027 calendar connects monthly baseline states to operating instructions and mandatory live checks.</desc><rect width="1600" height="900" fill="#071a32"/><path d="M0 0h1600v12H0z" fill="#c79a43"/><g font-family="Arial,sans-serif"><text x="72" y="92" fill="#dfc27d" font-size="20" font-weight="700" letter-spacing="4">ROLLING CONTROL · SEP 2026–AUG 2027</text><text x="72" y="178" fill="#fff" font-family="Georgia,serif" font-size="58" font-weight="700">A booking-led calendar, not a daily timetable.</text></g><g transform="translate(72 260)" font-family="Arial,sans-serif"><rect width="1456" height="478" fill="#fff"/><g font-size="19" font-weight="700" fill="#071a32"><text x="30" y="48">MONTH</text><text x="215" y="48">BASE</text><text x="390" y="48">OPERATING INSTRUCTION</text><text x="1035" y="48">LIVE CHECK</text></g><path d="M24 70h1408" stroke="#c79a43" stroke-width="3"/><g font-size="19" fill="#071a32"><text x="30" y="118">SEP</text><text x="215" y="118" fill="#467d68" font-weight="700">GREEN</text><text x="390" y="118">Normal pilot · balanced weekday cells</text><text x="1035" y="118">Weather · route · bookings</text><text x="30" y="178">OCT</text><text x="215" y="178" fill="#8b6418" font-weight="700">AMBER</text><text x="390" y="178">ADE crowd and route control</text><text x="1035" y="178">Event · transport · route</text><text x="30" y="238">NOV–FEB</text><text x="215" y="238" fill="#8b6418" font-weight="700">AMBER</text><text x="390" y="238">Earlier selective operation</text><text x="1035" y="238">Daylight · closures · economics</text><text x="30" y="298">MAR</text><text x="215" y="298" fill="#467d68" font-weight="700">GREEN</text><text x="390" y="298">Normal route · evidence-led expansion</text><text x="1035" y="298">Weather · guide · bookings</text><text x="30" y="358">APR</text><text x="215" y="358" fill="#8b6418" font-weight="700">AMBER</text><text x="390" y="358">Spring window · 27 April stop rule</text><text x="1035" y="358">Event · transport · route</text><text x="30" y="418">MAY–JUN</text><text x="215" y="418" fill="#467d68" font-weight="700">GREEN</text><text x="390" y="418">Long-day booking-led scale test</text><text x="1035" y="418">Heat · storms · capacity</text><text x="30" y="468">JUL–AUG</text><text x="215" y="468" fill="#8b6418" font-weight="700">AMBER</text><text x="390" y="468">Peak-crowd and rain controls</text><text x="1035" y="468">Crowds · forecast · route</text></g></g><text x="72" y="810" fill="#aebed0" font-family="Arial,sans-serif" font-size="21">Every row remains subject to live warnings, lawful operation, guide readiness and the approved commercial gate.</text></svg>
