<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Green Amber Red operating logic</title><desc id="desc">A management decision flow moves each departure from current evidence to green, amber or red authority.</desc><rect width="1600" height="900" fill="#f5f1e8"/><path d="M0 0h1600v12H0z" fill="#c79a43"/><g font-family="Arial,sans-serif"><text x="72" y="92" fill="#8b6418" font-size="20" font-weight="700" letter-spacing="4">DAY-OF-OPERATION AUTHORITY</text><text x="72" y="180" fill="#071a32" font-family="Georgia,serif" font-size="58" font-weight="700">The calendar proposes. Current evidence decides.</text></g><g transform="translate(72 280)" font-family="Arial,sans-serif"><rect width="300" height="360" fill="#071a32"/><text x="30" y="58" fill="#dfc27d" font-size="18" font-weight="700">CHECK CURRENT EVIDENCE</text><text x="30" y="122" fill="#fff" font-size="24" font-weight="700">Weather warning</text><text x="30" y="165" fill="#fff" font-size="24" font-weight="700">Route and permit</text><text x="30" y="208" fill="#fff" font-size="24" font-weight="700">Guide and access</text><text x="30" y="251" fill="#fff" font-size="24" font-weight="700">Bookings and channel</text><path d="M300 180h105" stroke="#c79a43" stroke-width="6"/><path d="m405 180-22-14v28z" fill="#c79a43"/>
<g transform="translate(430 0)"><rect width="292" height="360" fill="#467d68"/><text x="28" y="64" fill="#fff" font-size="34" font-weight="700">GREEN</text><text x="28" y="122" fill="#fff" font-size="21">All hard gates closed</text><text x="28" y="160" fill="#fff" font-size="21">Approved route available</text><text x="28" y="198" fill="#fff" font-size="21">Operate and record</text></g><g transform="translate(746 0)"><rect width="292" height="360" fill="#c79a43"/><text x="28" y="64" fill="#071a32" font-size="34" font-weight="700">AMBER</text><text x="28" y="122" fill="#071a32" font-size="21">Named control required</text><text x="28" y="160" fill="#071a32" font-size="21">Owner accepts action</text><text x="28" y="198" fill="#071a32" font-size="21">Switch and document</text></g><g transform="translate(1062 0)"><rect width="292" height="360" fill="#a33f3f"/><text x="28" y="64" fill="#fff" font-size="34" font-weight="700">RED</text><text x="28" y="122" fill="#fff" font-size="21">Hard gate open</text><text x="28" y="160" fill="#fff" font-size="21">No safe lawful variant</text><text x="28" y="198" fill="#fff" font-size="21">Stop and recover</text></g></g><text x="72" y="744" fill="#071a32" font-family="Georgia,serif" font-size="31" font-weight="700">Sales pressure never overrides a legal, safety or accessibility stop.</text><text x="72" y="794" fill="#52647a" font-family="Arial,sans-serif" font-size="21">Record the evidence, decision, control owner and customer recovery action.</text></svg>
