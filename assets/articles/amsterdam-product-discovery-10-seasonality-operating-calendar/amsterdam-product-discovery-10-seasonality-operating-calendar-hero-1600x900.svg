<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Amsterdam operating calendar</title><desc id="desc">A twelve-month operating calendar combines historical climate, live weather, destination demand, product bookings and event pressure.</desc>
  <rect width="1600" height="900" fill="#071a32"/><path d="M0 0h1600v12H0z" fill="#c79a43"/>
  <g font-family="Arial,sans-serif"><text x="72" y="92" fill="#dfc27d" font-size="20" font-weight="700" letter-spacing="4">ARTICLE 10 · OPERATING CALENDAR</text><text x="72" y="185" fill="#fff" font-family="Georgia,serif" font-size="62" font-weight="700">Plan the season. Decide the day.</text><text x="72" y="235" fill="#aebed0" font-size="23">Historical context sets the baseline. Live evidence controls every departure.</text></g>
  <g transform="translate(72 315)" font-family="Arial,sans-serif"><rect width="1456" height="390" rx="4" fill="#fff"/>
    <g fill="#071a32" font-size="17" font-weight="700"><text x="38" y="52">SEP</text><text x="154" y="52">OCT</text><text x="270" y="52">NOV</text><text x="386" y="52">DEC</text><text x="502" y="52">JAN</text><text x="618" y="52">FEB</text><text x="734" y="52">MAR</text><text x="850" y="52">APR</text><text x="966" y="52">MAY</text><text x="1082" y="52">JUN</text><text x="1198" y="52">JUL</text><text x="1314" y="52">AUG</text></g>
    <g transform="translate(28 82)"><rect width="96" height="96" fill="#467d68"/><rect x="116" width="96" height="96" fill="#c79a43"/><rect x="232" width="96" height="96" fill="#c79a43"/><rect x="348" width="96" height="96" fill="#c79a43"/><rect x="464" width="96" height="96" fill="#c79a43"/><rect x="580" width="96" height="96" fill="#c79a43"/><rect x="696" width="96" height="96" fill="#467d68"/><rect x="812" width="96" height="96" fill="#c79a43"/><rect x="928" width="96" height="96" fill="#467d68"/><rect x="1044" width="96" height="96" fill="#467d68"/><rect x="1160" width="96" height="96" fill="#c79a43"/><rect x="1276" width="96" height="96" fill="#c79a43"/></g>
    <path d="M28 225h1372" stroke="#d8d0c1"/><g font-size="20"><text x="38" y="274" fill="#071a32" font-weight="700">MONTHLY BASELINE</text><text x="300" y="274" fill="#52647a">Climate · daylight · known events</text><text x="38" y="326" fill="#071a32" font-weight="700">LIVE AUTHORITY</text><text x="300" y="326" fill="#52647a">Weather · route · permit · guide · bookings</text></g>
  </g><g font-family="Arial,sans-serif"><circle cx="98" cy="782" r="10" fill="#467d68"/><text x="120" y="790" fill="#fff" font-size="20">GREEN · approved conditions</text><circle cx="490" cy="782" r="10" fill="#c79a43"/><text x="512" y="790" fill="#fff" font-size="20">AMBER · explicit control</text><circle cx="896" cy="782" r="10" fill="#a33f3f"/><text x="918" y="790" fill="#fff" font-size="20">RED · do not operate</text></g>
</svg>
