<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">GUIDE ARTIFACT</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="41" font-weight="750" fill="#071A32" text-anchor="start">One attraction card supports flexible, controlled delivery</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">The card holds only the meaning, verified evidence, adaptable angles, interaction</text><text x="70" y="220" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">prompts, timing versions and operating reminders a guide can use.</text><rect x="70" y="285" width="400" height="180" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="100" y="335" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">01</text><text x="100" y="383" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#071A32" text-anchor="start">ONE-SENTENCE MEANING</text><text x="100" y="423" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="550" fill="#52667E" text-anchor="start">Purpose of the stop</text><rect x="510" y="285" width="400" height="180" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="540" y="335" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">02</text><text x="540" y="383" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#071A32" text-anchor="start"