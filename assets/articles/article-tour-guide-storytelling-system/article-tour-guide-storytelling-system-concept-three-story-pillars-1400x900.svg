-serif" font-size="16" font-weight="800" fill="#071A32" text-anchor="middle">02</text><text x="428" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#fff" text-anchor="start">VISION + LEADERSHIP</text><text x="428" y="535" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#D7E0E9" text-anchor="start">Transformation and</text><text x="428" y="562" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#D7E0E9" text-anchor="start">long-term development</text><rect x="730" y="300" width="290" height="360" rx="22" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><circle cx="785" cy="355" r="25" fill="#071A32"/><text x="785" y="362" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">03</text><text x="758" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#071A32" text-anchor="start">CULTURE + OPENNESS</text><text x="758" y="535" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">Tradition, dialogue and</text><text x="758" y="562" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">global connection</text><rect x="1060" y="300" width="290" height="360" rx="22" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><circle cx="1115" cy="355" r="25" fill="#071A32"/><text x="1115" y="362" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">04</text><text x="1088" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#071A32" text-anchor="start">NATURE + BALANCE</text><text x="1088" y="535" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">Coast, desert, islands</text><text x="1