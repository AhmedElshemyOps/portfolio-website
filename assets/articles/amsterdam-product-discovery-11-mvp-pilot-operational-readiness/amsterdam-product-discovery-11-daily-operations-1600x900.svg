<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F7F3EA"/><rect x="48" y="48" width="1504" height="804" rx="28" fill="#FFFFFF" stroke="#D9CDB8" stroke-width="3"/><rect x="48" y="48" width="1504" height="12" rx="6" fill="#C99A3D"/><text x="96" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#C99A3D" text-anchor="start">DAILY OPERATIONS PACK</text><text x="96" y="190" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#071A32" text-anchor="start">One departure, one accountable evidence trail</text><text x="96" y="238" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">Standard work protects readiness and learning while leaving the guide room to respond professionally to</text><text x="96" y="271" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">guests and place.</text><rect x="105" y="340" width="325" height="255" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="133" y="386" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">01</text><text x="133" y="428" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">Pre-departure brief</text><text x="133" y="466" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Owner, weather, access,</text><text x="133" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">supplier</text><rect x="470" y="340" width="325" height="255" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="498" y="386" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">02</text><text x="498" y="428" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">Guest + route checks</text><text x="498" y="466" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Meet, consent, pace,</text><text x="498" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">accessibility</text><rect x="835" y="340" width="325" height="255" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="863" y="386" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">03</text><text x="863" y="428" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">Live exception control</text><text x="863" y="466" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Log impact, action and</text><text x="863" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">authority</text><rect x="1200" y="340" width="325" height="255" rx="18" fill="#071A32" stroke="#C99A3D" stroke-width="3"/><text x="1228" y="386" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">04</text><text x="1228" y="428" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#fff" text-anchor="start">Close-out evidence</text><text x="1228" y="466" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#D8E0EA" text-anchor="start">Facts, feedback, incidents,</text><text x="1228" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#D8E0EA" text-anchor="start">learning</text><path d="M250 650C430 760 1170 760 1350 650" fill="none" stroke="#C99A3D" stroke-width="4" stroke-dasharray="12 10"/><text x="800" y="755" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="middle">Feed approved learning into Article 12</text><text x="96" y="818" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">BRIEF → DELIVER → RECOVER → RECORD → IMPROVE</text></svg>