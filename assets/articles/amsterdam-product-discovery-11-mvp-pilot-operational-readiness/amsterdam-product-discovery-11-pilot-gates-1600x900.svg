<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F7F3EA"/><rect x="48" y="48" width="1504" height="804" rx="28" fill="#FFFFFF" stroke="#D9CDB8" stroke-width="3"/><rect x="48" y="48" width="1504" height="12" rx="6" fill="#C99A3D"/><text x="96" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#C99A3D" text-anchor="start">PILOT CONTROL BOARD</text><text x="96" y="190" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#071A32" text-anchor="start">Six phases, six explicit exit gates</text><text x="96" y="238" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">The team advances because evidence closes a gate—not because the calendar says the next phase has begun.</text><rect x="92" y="315" width="445" height="175" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="120" y="361" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">GATE 1</text><text x="120" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">Scope</text><text x="120" y="441" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Promise and sample defined</text><rect x="582" y="315" width="445" height="175" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="610" y="361" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">GATE 2</text><text x="610" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">Build</text><text x="610" y="441" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Controls and owners ready</text><rect x="1072" y="315" width="445" height="175" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="1100" y="361" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">GATE 3</text><text x="1100" y="403" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">Dry run</text><text x="1100" y="441" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">End-to-end rehearsal passed</text><rect x="92" y="535" width="445" height="175" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="120" y="581" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">GATE 4</text><text x="120" y="623" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">Soft pilot</text><text x="120" y="661" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Exposure remains limited</text><rect x="582" y="535" width="445" height="175" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="610" y="581" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">GATE 5</text><text x="610" y="623" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">Paid MVP</text><text x="610" y="661" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Departure evidence captured</text><rect x="1072" y="535" width="445" height="175" rx="18" fill="#071A32" stroke="#C99A3D" stroke-width="3"/><text x="1100" y="581" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">GATE 6</text><text x="1100" y="623" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#fff" text-anchor="start">Review</text><text x="1100" y="661" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#D8E0EA" text-anchor="start">Continue, change or stop</text><text x="96" y="818" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">CONTROLLED PROGRESSION · NO SILENT ASSUMPTIONS</text></svg>