<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F7F3EA"/><rect x="48" y="48" width="1504" height="804" rx="28" fill="#FFFFFF" stroke="#D9CDB8" stroke-width="3"/><rect x="48" y="48" width="1504" height="12" rx="6" fill="#C99A3D"/><text x="96" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#C99A3D" text-anchor="start">EXPERIMENT BACKLOG</text><text x="96" y="190" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#071A32" text-anchor="start">Turn assumptions into controlled tests</text><text x="96" y="238" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">Each uncertainty receives an owner, a safe test, a success threshold and a decision date before it can</text><text x="96" y="271" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">influence launch.</text><rect x="95" y="300" width="1410" height="420" rx="20" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="130" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">ASSUMPTION</text><text x="430" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">SAFE TEST</text><text x="760" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">THRESHOLD</text><text x="1040" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">OWNER</text><text x="1280" y="355" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">DECISION</text><text x="130" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#071A32" text-anchor="start">Guests value layered</text><text x="130" y="453" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#071A32" text-anchor="start">stories</text><text x="430" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Moderated route walk</text><text x="760" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Intent +</text><text x="760" y="453" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">comprehension</text><text x="1040" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Product lead</text><text x="1280" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Keep / revise</text><text x="130" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#071A32" text-anchor="start">Timing survives real</text><text x="130" y="558" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#071A32" text-anchor="start">streets</text><text x="430" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Timed dry run</text><text x="760" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Route inside</text><text x="760" y="558" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">tolerance</text><text x="1040" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Operations</text><text x="1280" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Go / constrain</text><text x="130" y="635" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#071A32" text-anchor="start">Guide controls are</text><text x="130" y="663" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#071A32" text-anchor="start">usable</text><text x="430" y="635" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Scenario rehearsal</text><text x="760" y="635" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Critical steps</text><text x="760" y="663" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">complete</text><text x="1040" y="635" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Guide lead</text><text x="1280" y="635" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#5C6D82" text-anchor="start">Train / redesign</text><text x="96" y="818" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">ASSUMPTION → TEST → EVIDENCE → DECISION</text></svg>