<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1070 0H1400V330Z" fill="#E8DDC7" opacity=".78"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">PLANNING WORKFLOW</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="42" font-weight="750" fill="#071A32" text-anchor="start">The two-stage itinerary method</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">Design the guest-centred flow first, then prove that every leg can be delivered.</text><rect x="80" y="275" width="560" height="430" rx="22" fill="#071A32"/><text x="130" y="335" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#DFC27D" text-anchor="start">STAGE 01</text><text x="130" y="385" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="start">Design the experience</text><text x="145" y="455" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#D7E0E9" text-anchor="start">• Guest priorities and pace</text><text x="145" y="513" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#D7E0E9" text-anchor="start">• Meaningful sequence</text><text x="145" y="571" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#D7E0E9" text-anchor="start">• Meals, rest and free time</text><text x="145" y="629" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#D7E0E9" text-anchor="start">• Desired service moments</text><path d="M665 490H735" stroke="#C79A43" stroke-width="7"/><path d="M713 468L735 490L713 512" fill="none" stroke="#C79A43" stroke-width="7"/><rect x="760" y="275" width="560" height="430" rx="22" fill="#FCFAF5" stroke="#C79A43" stroke-width="3"/><text x="810" y="335" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">STAGE 02</text><text x="810" y="385" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30" font-weight="800" fill="#071A32" text-anchor="start">Audit the operation</text><text x="825" y="455" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#18304D" text-anchor="start">• Hours, tickets and access</text><text x="825" y="513" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#18304D" text-anchor="start">• Transfers and movement buffers</text><text x="825" y="571" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#18304D" text-anchor="start">• Supplier and capacity status</text><text x="825" y="629" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="650" fill="#18304D" text-anchor="start">• Contingency and approval</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">AHMED MAHMOUD · TOURISM OPERATIONS</text></svg>
