-anchor="middle">04</text><text x="865" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="750" fill="#071A32" text-anchor="start">Boarding</text><text x="865" y="475" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">Count, luggage +</text><text x="865" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">accessibility</text><path d="M1060 461H1095" stroke="#C79A43" stroke-width="5"/><path d="M1080 447L1095 461L1080 475" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="1095" y="335" width="215" height="250" rx="18" fill="#071A32" stroke="#C79A43" stroke-width="3"/><circle cx="1130" cy="380" r="21" fill="#C79A43"/><text x="1130" y="387" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#071A32" text-anchor="middle">05</text><text x="1115" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="750" fill="#fff" text-anchor="start">Release</text><text x="1115" y="475" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#D7E0E9" text-anchor="start">Authority, time +</text><text x="1115" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#D7E0E9" text-anchor="start">venue handoff</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · MICE MOVEMENT CONTROL</text></svg>
