<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">COMMUNICATION CONTROL</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="41" font-weight="750" fill="#071A32" text-anchor="start">A sent instruction is not a confirmed assignment</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">One service record connects reservations, dispatch, driver, guide, guest and</text><text x="70" y="220" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">recovery through acknowledgement and completion evidence.</text><rect x="95" y="340" width="215" height="245" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><circle cx="130" cy="385" r="21" fill="#071A32"/><text x="130" y="392" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">01</text><text x="115" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="750" fill="#071A32" text-anchor="start">Confirm</text><text x="115" y="480" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">Booking and</text><text x="115" y="507" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">service approved</text><path d="M310 462H345" stroke="#C79A43" stroke-width="5"/><path d="M330 448L345 462L330 476" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="345" y="340" width="215" height="245" rx="18" fill="#FCFAF5" stroke=