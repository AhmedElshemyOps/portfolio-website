ation + local life</text><text x="1091" y="724" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B6B55" text-anchor="start">STRONG</text><path d="M55 760H1345" stroke="#DED5C4"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">AMSTERDAM PRODUCT DISCOVERY · CORRIDOR FIT</text></svg>
