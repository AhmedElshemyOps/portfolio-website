<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Air connectivity intelligence operating board</title>
  <desc id="desc">A polished DMC operating board showing how a public airline route signal becomes guest market intelligence, product readiness, sales activation, operations preparation and booking validation.</desc>
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07162d"/>
      <stop offset=".58" stop-color="#102f58"/>
      <stop offset="1" stop-color="#183f66"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0d074"/>
      <stop offset="1" stop-color="#d3a21b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020b18" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="44" fill="url(#boardBg)"/>
  <g opacity=".12" stroke="#e8f1ff" stroke-width="1">
    <path d="M80 150H1520M80 250H1520M80 350H1520M80 450H1520M80 550H1520M80 650H1520M80 750H1520"/>
    <path d="M160 90V810M320 90V810M480 90V810M640 90V810M800 90V810M960 90V810M1120 90V810M1280 90V810M1440 90V810"/>
  </g>

  <text x="92" y="104" fill="#f0d074" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="5">AIR CONNECTIVITY INTELLIGENCE</text>
  <text x="92" y="164" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="54" font-weight="900">From route signal to guest-ready service</text>
  <text x="92" y="207" fill="#cfe0f1" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25">A management workflow for turning new airline access into commercial and operational action.</text>

  <g transform="translate(92 260)" filter="url(#softShadow)">
    <rect width="1416" height="520" rx="30" fill="#f8fbff"/>
    <rect width="1416" height="78" rx="30" fill="#07162d"/>
    <path d="M0 48H1416V84H0Z" fill="#07162d"/>
    <text x="34" y="50" fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="850" letter-spacing="3">ROUTE READINESS OPERATING BOARD</text>
    <text x="1050" y="50" fill="#f0d074" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="850">DMC ACTION MODEL</text>

    <g transform="translate(34 112)" font-family="Inter, Arial, Helvetica, sans-serif">
      <g>
        <rect width="258" height="142" rx="22" fill="url(#panelBg)" stroke="#d5e2f0"/>
        <rect x="18" y="18" width="38" height="38" rx="12" fill="url(#gold)"/>
        <text x="37" y="44" text-anchor="middle" fill="#07162d" font-size="15" font-weight="900">01</text>
        <text x="74" y="36" fill="#765c20" font-size="13" font-weight="900" letter-spacing="2">PUBLIC SIGNAL</text>
        <text x="22" y="84" fill="#102f58" font-size="24" font-weight="900">New airline route</text>
        <text x="22" y="114" fill="#536b86" font-size="18">Airport, frequency, season,</text>
        <text x="22" y="137" fill="#536b86" font-size="18">source market and timing.</text>
      </g>

      <g transform="translate(310 0)">
        <rect width="258" height="142" rx="22" fill="url(#panelBg)" stroke="#d5e2f0"/>
        <rect x="18" y="18" width="38" height="38" rx="12" fill="url(#gold)"/>
        <text x="37" y="44" text-anchor="middle" fill="#07162d" font-size="15" font-weight="900">02</text>
        <text x="74" y="36" fill="#765c20" font-size="13" font-weight="900" letter-spacing="2">MARKET QUESTION</text>
        <text x="22" y="84" fill="#102f58" font-size="24" font-weight="900">Guest hypothesis</text>
        <text x="22" y="114" fill="#536b86" font-size="18">Who may travel, why, and</text>
        <text x="22" y="137" fill="#536b86" font-size="18">what trip length fits?</text>
      </g>

      <g transform="translate(620 0)">
        <rect width="258" height="142" rx="22" fill="url(#panelBg)" stroke="#d5e2f0"/>
        <rect x="18" y="18" width="38" height="38" rx="12" fill="url(#gold)"/>
        <text x="37" y="44" text-anchor="middle" fill="#07162d" font-size="15" font-weight="900">03</text>
        <text x="74" y="36" fill="#765c20" font-size="13" font-weight="900" letter-spacing="2">SERVICE FIT</text>
        <text x="22" y="84" fill="#102f58" font-size="24" font-weight="900">Language readiness</text>
        <text x="22" y="114" fill="#536b86" font-size="18">Ask the market; avoid</text>
        <text x="22" y="137" fill="#536b86" font-size="18">stereotype-based planning.</text>
      </g>

      <g transform="translate(930 0)">
        <rect width="258" height="142" rx="22" fill="url(#panelBg)" stroke="#d5e2f0"/>
        <rect x="18" y="18" width="38" height="38" rx="12" fill="url(#gold)"/>
        <text x="37" y="44" text-anchor="middle" fill="#07162d" font-size="15" font-weight="900">04</text>
        <text x="74" y="36" fill="#765c20" font-size="13" font-weight="900" letter-spacing="2">PRODUCT DESIGN</text>
        <text x="22" y="84" fill="#102f58" font-size="24" font-weight="900">Guest-ready offer</text>
        <text x="22" y="114" fill="#536b86" font-size="18">Package pace, inclusions,</text>
        <text x="22" y="137" fill="#536b86" font-size="18">pricing and timing.</text>
      </g>

      <g transform="translate(148 208)">
        <rect width="258" height="142" rx="22" fill="url(#panelBg)" stroke="#d5e2f0"/>
        <rect x="18" y="18" width="38" height="38" rx="12" fill="url(#gold)"/>
        <text x="37" y="44" text-anchor="middle" fill="#07162d" font-size="15" font-weight="900">05</text>
        <text x="74" y="36" fill="#765c20" font-size="13" font-weight="900" letter-spacing="2">SALES TEST</text>
        <text x="22" y="84" fill="#102f58" font-size="24" font-weight="900">Partner activation</text>
        <text x="22" y="114" fill="#536b86" font-size="18">Brief agents and measure</text>
        <text x="22" y="137" fill="#536b86" font-size="18">enquiries, not opinions.</text>
      </g>

      <g transform="translate(458 208)">
        <rect width="258" height="142" rx="22" fill="url(#panelBg)" stroke="#d5e2f0"/>
        <rect x="18" y="18" width="38" height="38" rx="12" fill="url(#gold)"/>
        <text x="37" y="44" text-anchor="middle" fill="#07162d" font-size="15" font-weight="900">06</text>
        <text x="74" y="36" fill="#765c20" font-size="13" font-weight="900" letter-spacing="2">DELIVERY CHECK</text>
        <text x="22" y="84" fill="#102f58" font-size="24" font-weight="900">Operations planning</text>
        <text x="22" y="114" fill="#536b86" font-size="18">Guides, vehicles, suppliers,</text>
        <text x="22" y="137" fill="#536b86" font-size="18">arrival windows and recovery.</text>
      </g>

      <g transform="translate(768 208)">
        <rect width="258" height="142" rx="22" fill="url(#panelBg)" stroke="#d5e2f0"/>
        <rect x="18" y="18" width="38" height="38" rx="12" fill="url(#gold)"/>
        <text x="37" y="44" text-anchor="middle" fill="#07162d" font-size="15" font-weight="900">07</text>
        <text x="74" y="36" fill="#765c20" font-size="13" font-weight="900" letter-spacing="2">REALITY PROOF</text>
        <text x="22" y="84" fill="#102f58" font-size="24" font-weight="900">Booking validation</text>
        <text x="22" y="114" fill="#536b86" font-size="18">Confirm demand through</text>
        <text x="22" y="137" fill="#536b86" font-size="18">bookings and delivery data.</text>
      </g>
    </g>

    <g fill="none" stroke="#d3a21b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M298 183H340"/>
      <path d="M608 183H650"/>
      <path d="M918 183H960"/>
      <path d="M1222 257C1308 288 1308 413 1125 413"/>
      <path d="M438 413H478"/>
      <path d="M748 413H788"/>
    </g>

    <g transform="translate(1094 332)">
      <rect width="286" height="128" rx="22" fill="#fff8e5" stroke="#e4c36a"/>
      <text x="24" y="36" fill="#765c20" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="900" letter-spacing="2">DECISION DISCIPLINE</text>
      <text x="24" y="66" fill="#07162d" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="900">Confidence grows after</text>
      <text x="24" y="91" fill="#07162d" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="900">enquiries, bookings and</text>
      <text x="24" y="116" fill="#07162d" font-family="Inter, Arial, Helvetica, sans-serif" font-size="18" font-weight="900">delivery validation.</text>
    </g>
  </g>

  <g transform="translate(92 820)" font-family="Inter, Arial, Helvetica, sans-serif">
    <rect width="1416" height="54" rx="18" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.14)"/>
    <text x="24" y="35" fill="#cfe0f1" font-size="19">Management use:</text>
    <text x="194" y="35" fill="#ffffff" font-size="19" font-weight="800">monitor public route data, test product-market fit, prepare teams early, and validate with real demand.</text>
  </g>
</svg>
