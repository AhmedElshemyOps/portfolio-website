<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">DOCUMENT LIFECYCLE</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Every controlled instruction follows a visible state and authority path</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Request, draft, review, approval, release, distribution, change, withdrawal and</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">retention remain traceable to the accountable owner and effective version.</text><rect x="70" y="285" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">01</text><text x="98" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Request</text><text x="98" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Trigger, owner + priority</text><rect x="391" y="285" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="419" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">02</text><text x="419" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Draft</text><text x="419" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Author + controlled template</text><rect x="712" y="285" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="740" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">03</text><text x="740" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Review</text><text x="740" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Operational and technical</text><text x="740" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">evidence</text><rect x="1033" y="285" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="1061" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">04</text><text x="1061" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Approve</text><text x="1061" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Named authority + date</text><rect x="70" y="500" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">05</text><text x="98" y="588" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Release</text><text x="98" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Effective version +</text><text x="98" y="655" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">communication</text><rect x="391" y="500" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="419" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">06</text><text x="419" y="588" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Use + change</text><text x="419" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Access, feedback + impact</text><rect x="712" y="500" width="297" height="185" rx="18" fill="#071A32" stroke="#C79A43" stroke-width="3"/><text x="740" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">07</text><text x="740" y="588" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#fff" text-anchor="start">Withdraw</text><text x="740" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#D7E0E9" text-anchor="start">Replace, archive + retain</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · IMPROVEMENT UNDER CONTROL</text></svg>
