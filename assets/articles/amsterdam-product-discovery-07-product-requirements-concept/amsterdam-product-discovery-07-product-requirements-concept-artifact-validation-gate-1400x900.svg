<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">DECISION GATE 3</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="41" font-weight="750" fill="#071A32" text-anchor="start">Concept approved for validation—not launch</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">The traced concept may enter commercial and field testing while price, contracts,</text><text x="70" y="220" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">route audit and stakeholder acceptance remain open.</text><rect x="125" y="285" width="760" height="420" rx="22" fill="#FCFAF5" stroke="#1B6B55" stroke-width="4"/><text x="165" y="345" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="800" fill="#1B6B55" text-anchor="start">APPROVED FOR VALIDATION</text><circle cx="180" cy="410" r="15" fill="#1B6B55"/><path d="M172 410l7 8 13-18" fill="none" stroke="#fff" stroke-width="3"/><text x="215" y="418" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#071A32" text-anchor="start">Evidence-traced core components</text><circle cx="180" cy="474" r="15" fill="#1B6B55"/><path d="M172 474l7 8 13-18" fill="none" stroke="#fff" stroke-width="3"/><text x="215" y="482" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#071A32" text-anchor="start">Qualified-guide pathway publicly feasible</text><circle cx="180" cy="538" r="15" fill="#1B6B55"/><path d="M172 538l7 8 13-18" fill="none" stroke="#fff" stroke-width="3"/><text x="215" y="546" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#071A32" text-anchor="start">Optional suppliers outside critical path</text><circle cx="180" cy="602" r="15" fill="#1B6B55"/><path d="M172 602l7 8 13-18" fill="none" stroke="#fff" stroke-width="3"/><text x="215" y="610" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#071A32" text-anchor="start">Measurable product acceptance criteria</text><path d="M915 495H1010" stroke="#9A3E3E" stroke-width="6"/><rect x="1035" y="285" width="260" height="420" rx="22" fill="#071A32" stroke="#9A3E3E" stroke-width="4"/><text x="1165" y="345" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#DFC27D" text-anchor="middle">NOT LAUNCH</text><text x="1165" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="650" fill="#fff" text-anchor="middle">Price + margin</text><text x="1165" y="474" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="650" fill="#fff" text-anchor="middle">Supplier contracts</text><text x="1165" y="528" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="650" fill="#fff" text-anchor="middle">Physical route audit</text><text x="1165" y="582" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="650" fill="#fff" text-anchor="middle">Language demand</text><text x="1165" y="636" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="650" fill="#fff" text-anchor="middle">Stakeholder acceptance</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">AMSTERDAM PRODUCT DISCOVERY · CONCEPT GATE</text></svg>
