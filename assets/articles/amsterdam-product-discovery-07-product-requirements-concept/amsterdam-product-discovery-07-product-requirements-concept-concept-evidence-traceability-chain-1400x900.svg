<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">CONCEPT CONTROL</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="41" font-weight="750" fill="#071A32" text-anchor="start">No feature enters without a complete evidence chain</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">Evidence becomes an insight, requirement, feature and measurable acceptance</text><text x="70" y="220" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">criterion—or remains an experiment.</text><rect x="95" y="340" width="215" height="245" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><circle cx="130" cy="385" r="21" fill="#071A32"/><text x="130" y="392" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">01</text><text x="115" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="750" fill="#071A32" text-anchor="start">Evidence</text><text x="115" y="480" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">Observed source or</text><text x="115" y="507" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">governed dataset</text><path d="M310 462H345" stroke="#C79A43" stroke-width="5"/><path d="M330 448L345 462L330 476" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="345" y="340" width="215" height="245" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><circle cx="380" cy="385" r="21" fill="#071A32"/><text x="380" y="392" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">02</text><text x="365" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="750" fill="#071A32" text-anchor="start">Insight</text><text x="365" y="480" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">Supported meaning</text><text x="365" y="507" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">and boundary</text><path d="M560 462H595" stroke="#C79A43" stroke-width="5"/><path d="M580 448L595 462L580 476" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="595" y="340" width="215" height="245" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><circle cx="630" cy="385" r="21" fill="#071A32"/><text x="630" y="392" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">03</text><text x="615" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="750" fill="#071A32" text-anchor="start">Requirement</text><text x="615" y="480" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">Testable product</text><text x="615" y="507" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">obligation</text><path d="M810 462H845" stroke="#C79A43" stroke-width="5"/><path d="M830 448L845 462L830 476" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="845" y="340" width="215" height="245" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><circle cx="880" cy="385" r="21" fill="#071A32"/><text x="880" y="392" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">04</text><text x="865" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="750" fill="#071A32" text-anchor="start">Feature</text><text x="865" y="480" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">Minimum design</text><text x="865" y="507" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#52667E" text-anchor="start">response</text><path d="M1060 462H1095" stroke="#C79A43" stroke-width="5"/><path d="M1080 448L1095 462L1080 476" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="1095" y="340" width="215" height="245" rx="18" fill="#071A32" stroke="#C9B98F" stroke-width="2"/><circle cx="1130" cy="385" r="21" fill="#C79A43"/><text x="1130" y="392" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#071A32" text-anchor="middle">05</text><text x="1115" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="750" fill="#fff" text-anchor="start">KPI</text><text x="1115" y="480" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#D7E0E9" text-anchor="start">Acceptance and</text><text x="1115" y="507" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#D7E0E9" text-anchor="start">revision trigger</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">AMSTERDAM PRODUCT DISCOVERY · TRACEABILITY</text></svg>
