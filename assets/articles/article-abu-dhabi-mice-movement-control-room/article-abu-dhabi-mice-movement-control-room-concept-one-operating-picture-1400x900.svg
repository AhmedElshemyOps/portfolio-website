<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">CONTROL-ROOM MODEL</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">One operating picture connects movement, ownership and time</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The control room does not watch people as one crowd; it connects each wave to a</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">location, service promise, next decision and accountable owner.</text><circle cx="700" cy="470" r="120" fill="#071A32" stroke="#C79A43" stroke-width="6"/><text x="700" y="455" font-family="IBM Plex Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#DFC27D" text-anchor="middle">DECISION</text><text x="700" y="492" font-family="IBM Plex Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle">CONTROL</text><rect x="210" y="310" width="270" height="110" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="345" y="375" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#071A32" text-anchor="middle">AIRPORT WAVES</text><path d="M480 365L590 420" stroke="#C79A43" stroke-width="5"/><rect x="1010" y="310" width="270" height="110" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="1145" y="375" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#071A32" text-anchor="middle">HOTEL DESKS</text><path d="M1010 365L810 420" stroke="#C79A43" stroke-width="5"/><rect x="210" y="620" width="270" height="110" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="345" y="685" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#071A32" text-anchor="middle">COACH RELEASE</text><path d="M480 675L590 520" stroke="#C79A43" stroke-width="5"/><rect x="1010" y="620" width="270" height="110" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="1145" y="685" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#071A32" text-anchor="middle">VENUE ARRIVAL</text><path d="M1010 675L810 520" stroke="#C79A43" stroke-width="5"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · MICE MOVEMENT CONTROL</text></svg>
