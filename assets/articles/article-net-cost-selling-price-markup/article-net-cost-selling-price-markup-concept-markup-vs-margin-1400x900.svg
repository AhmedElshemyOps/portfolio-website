<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">PERCENTAGE BASIS</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Markup and margin use different denominators</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The same profit amount produces different percentages depending on whether the</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">reference is net cost or selling price.</text><rect x="90" y="310" width="560" height="360" rx="24" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="130" y="370" font-family="IBM Plex Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#071A32" text-anchor="start">MARKUP</text><text x="130" y="425" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#18304D" text-anchor="start">Profit divided by net cost</text><text x="170" y="525" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#8B6418" text-anchor="start">PROFIT</text><path d="M150 550H590" stroke="#C79A43" stroke-width="5"/><text x="170" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="start">NET COST</text><rect x="750" y="310" width="560" height="360" rx="24" fill="#071A32" stroke="#C79A43" stroke-width="4"/><text x="790" y="370" font-family="IBM Plex Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#DFC27D" text-anchor="start">MARGIN</text><text x="790" y="425" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#fff" text-anchor="start">Profit divided by selling price</text><text x="830" y="525" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#DFC27D" text-anchor="start">PROFIT</text><path d="M810 550H1250" stroke="#C79A43" stroke-width="5"/><text x="830" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="start">SELLING PRICE</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · COMMERCIAL CONTROL</text></svg>
