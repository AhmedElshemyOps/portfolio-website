="500" fill="#18304D" text-anchor="start">Actual release time</text><text x="841" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Receipt + next update</text><path d="M30 750H1375" stroke="#DED5C4"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · MICE MOVEMENT CONTROL</text></svg>
