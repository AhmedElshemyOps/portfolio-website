<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">MANAGER RELEASE</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Performance—not polished screenshots—approves the instruction</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Representative users must complete the bounded task, recognize warnings, meet</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">acceptance criteria, create evidence and survive normal platform change.</text><rect x="65" y="270" width="1250" height="480" rx="16" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><path d="M65 286Q65 270 81 270H1299Q1315 270 1315 286V340H65Z" fill="#071A32"/><text x="81" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">RELEASE AREA</text><text x="341" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">EVIDENCE</text><text x="901" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">DECISION TEST</text><text x="81" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Boundary</text><text x="341" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">One task, trigger + finish</text><text x="901" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">No hidden second process</text><path d="M65 422H1315" stroke="#DED5C4"/><text x="81" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Prerequisites</text><text x="341" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">User, access, source + caution</text><text x="901" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Ready before step one</text><path d="M65 504H1315" stroke="#DED5C4"/><text x="81" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Steps</text><text x="341" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">One observable action each</text><text x="901" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">No coaching required</text><path d="M65 586H1315" stroke="#DED5C4"/><text x="81" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Acceptance</text><text x="341" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Correct result + evidence location</text><text x="901" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Completion is testable</text><path d="M65 668H1315" stroke="#DED5C4"/><text x="81" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Change control</text><text x="341" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Owner + screen-review trigger</text><text x="901" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Stable beyond one screenshot</text><path d="M65 750H1315" stroke="#DED5C4"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · POINT-OF-WORK CONTROLS</text></svg>
