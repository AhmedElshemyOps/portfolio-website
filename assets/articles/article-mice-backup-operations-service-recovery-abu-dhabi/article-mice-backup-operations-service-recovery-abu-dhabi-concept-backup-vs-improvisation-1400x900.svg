<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">RESILIENCE PRINCIPLE</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">A usable backup is prepared; improvisation begins after control is lost</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The difference is visible in triggers, resources, authority, communication and the</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">route back to controlled service.</text><rect x="70" y="300" width="570" height="370" rx="24" fill="#071A32" stroke="#C79A43" stroke-width="4"/><text x="110" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#DFC27D" text-anchor="start">PREPARED BACKUP</text><text x="120" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Defined trigger + deadline</text><text x="120" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Verified resource + owner</text><text x="120" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Approved authority + cost</text><text x="120" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Guest message + recovery route</text><rect x="760" y="300" width="570" height="370" rx="24" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="800" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#9A3E3E" text-anchor="start">IMPROVISATION RISK</text><text x="810" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Late reaction</text><text x="810" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Unverified alternative</text><text x="810" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Unclear authority</text><text x="810" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Conflicting communication</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · RECOVERY + ARCHITECTURE</text></svg>
