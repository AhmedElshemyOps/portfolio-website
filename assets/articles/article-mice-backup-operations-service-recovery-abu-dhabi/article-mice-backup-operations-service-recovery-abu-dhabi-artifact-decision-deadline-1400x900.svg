<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">DECISION DEADLINE</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">A backup decision is made before the guest loses the service</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The operating clock connects the latest safe decision time to current evidence,</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">authority, supplier response and guest impact.</text><rect x="40" y="270" width="1310" height="480" rx="16" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><path d="M40 286Q40 270 56 270H1334Q1350 270 1350 286V340H40Z" fill="#071A32"/><text x="56" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">CLOCK POINT</text><text x="296" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">CONTROL QUESTION</text><text x="866" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">DECISION USE</text><text x="56" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Signal</text><text x="296" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">What changed and when?</text><text x="866" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Start the response clock</text><path d="M40 422H1350" stroke="#DED5C4"/><text x="56" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Verify</text><text x="296" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">What fact is still missing?</text><text x="866" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Set evidence deadline</text><path d="M40 504H1350" stroke="#DED5C4"/><text x="56" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Commit</text><text x="296" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">When must a route be chosen?</text><text x="866" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Use approval threshold</text><path d="M40 586H1350" stroke="#DED5C4"/><text x="56" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Communicate</text><text x="296" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">When does the guest need clarity?</text><text x="866" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Issue useful update</text><path d="M40 668H1350" stroke="#DED5C4"/><text x="56" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Recover</text><text x="296" y="706" font-family="IBM Plex Sans, Arial, sans-serif" fon