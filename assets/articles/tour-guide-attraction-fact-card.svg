<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Attraction fact card for tour guides</title>
<desc id="desc">A practical one-page fact card with six elements that a guide should carry for every attraction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eff5f8"/></linearGradient>
  <linearGradient id="banner" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071527"/><stop offset="1" stop-color="#174b68"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#071527" flood-opacity=".16"/></filter>
</defs>
<rect width="1600" height="900" rx="46" fill="url(#bg)"/>
<path d="M0 710C260 650 410 760 650 700s360-130 950-20v220H0z" fill="#d4e7eb"/>
<g filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif">
 <rect x="240" y="82" width="1120" height="736" rx="34" fill="#fff"/>
 <path d="M240 116a34 34 0 0 1 34-34h1052a34 34 0 0 1 34 34v182H240z" fill="url(#banner)"/>
 <text x="310" y="150" fill="#eecf84" font-size="22" font-weight="700" letter-spacing="4">ATTRACTION FACT CARD</text>
 <text x="310" y="215" fill="#fff" font-size="43" font-weight="800">Prepare the meaning, not a rigid speech</text>
 <text x="310" y="248" fill="#d6e4f1" font-size="22">A one-page tool that makes a guide accurate, adaptable and operationally ready.</text>
 <g>
  <g transform="translate(300 332)"><rect width="330" height="180" rx="22" fill="#f8f1df"/><text x="26" y="48" fill="#9a681d" font-size="16" font-weight="800">01 · ONE-SENTENCE MEANING</text><text x="26" y="82" fill="#071527" font-size="21" font-weight="800">What is this place</text><text x="26" y="108" fill="#071527" font-size="21" font-weight="800">really trying to help</text><text x="26" y="134" fill="#071527" font-size="21" font-weight="800">guests understand?</text><text x="26" y="162" fill="#566d82" font-size="15">A clear purpose guides the story.</text></g>
  <g transform="translate(660 332)"><rect width="330" height="180" rx="22" fill="#f4f8fc"/><text x="26" y="48" fill="#123b63" font-size="16" font-weight="800">02 · TOP FIVE VERIFIED FACTS</text><text x="26" y="91" fill="#071527" font-size="24" font-weight="800">Facts that matter,</text><text x="26" y="121" fill="#071527" font-size="24" font-weight="800">not a list of everything.</text><text x="26" y="152" fill="#566d82" font-size="16">Check sources and update them.</text></g>
  <g transform="translate(1020 332)"><rect width="280" height="180" rx="22" fill="#edf7f6"/><text x="26" y="48" fill="#0d7069" font-size="16" font-weight="800">03 · STORY ANGLES</text><text x="26" y="91" fill="#071527" font-size="22" font-weight="800">Different routes into</text><text x="26" y="119" fill="#071527" font-size="22" font-weight="800">the same truth.</text><text x="26" y="152" fill="#566d82" font-size="16">Culture · design · family · learning</text></g>
  <g transform="translate(300 554)"><rect width="330" height="180" rx="22" fill="#f4f8fc"/><text x="26" y="48" fill="#123b63" font-size="16" font-weight="800">04 · GUEST QUESTIONS</text><text x="26" y="91" fill="#071527" font-size="24" font-weight="800">What did you notice?</text><text x="26" y="121" fill="#071527" font-size="24" font-weight="800">What made you curious?</text><text x="26" y="152" fill="#566d82" font-size="16">Invite participation, then adapt.</text></g>
  <g transform="translate(660 554)"><rect width="330" height="180" rx="22" fill="#f8f1df"/><text x="26" y="48" fill="#9a681d" font-size="16" font-weight="800">05 · FLEXIBLE LENGTHS</text><text x="26" y="91" fill="#071527" font-size="24" font-weight="800">90 seconds · 3 minutes</text><text x="26" y="121" fill="#071527" font-size="24" font-weight="800">· 7 minutes</text><text x="26" y="152" fill="#566d82" font-size="16">Protect quality when timing changes.</text></g>
  <g transform="translate(1020 554)"><rect width="280" height="180" rx="22" fill="#edf7f6"/><text x="26" y="48" fill="#0d7069" font-size="16" font-weight="800">06 · OPERATIONS</text><text x="26" y="91" fill="#071527" font-size="22" font-weight="800">Access · etiquette</text><text x="26" y="119" fill="#071527" font-size="22" font-weight="800">· comfort · safety</text><text x="26" y="152" fill="#566d82" font-size="16">Make the story deliverable.</text></g>
 </g>
</g>
</svg>