<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">CONTROL-DASHBOARD REVIEW</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">The screen is ready when managers can interpret, investigate and act</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Release checks decision relevance, controlled definitions, data lineage, balanced</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">coverage, accessible layering, escalation ownership, auditability and the routine</text><text x="70" y="250" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">for reviewing the measures themselves.</text><rect x="65" y="270" width="1250" height="480" rx="16" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><path d="M65 286Q65 270 81 270H1299Q1315 270 1315 286V340H65Z" fill="#071A32"/><text x="81" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">REVIEW AREA</text><text x="341" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">REQUIRED EVIDENCE</text><text x="901" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">ACCEPTANCE TEST</text><text x="81" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Decision</text><text x="341" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Named question, owner + action</text><text x="901" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Every measure changes a decision</text><path d="M65 422H1315" stroke="#DED5C4"/><text x="81" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Definition</text><text x="341" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Formula, scope, context + version</text><text x="901" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Different users interpret it</text><text x="901" y="481" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">alike</text><path d="M65 504H1315" stroke="#DED5C4"/><text x="81" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Provenance</text><text x="341" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Source, timestamp + quality route</text><text x="901" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">The number can be traced</text><path d="M65 586H1315" stroke="#DED5C4"/><text x="81" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Balance</text><text x="341" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Outcome, driver, risk + people</text><text x="901" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Optimization cannot hide wider</text><text x="901" y="645" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">harm</text><path d="M65 668H1315" stroke="#DED5C4"/><text x="81" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Use</text><text x="341" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Layering, drill-down + review rhythm</text><text x="901" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Managers can move from signal to</text><text x="901" y="727" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">action</text><path d="M65 750H1315" stroke="#DED5C4"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · CONTROL THAT SURVIVES THE HANDOFF</text></svg>
