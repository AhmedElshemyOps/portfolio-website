<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">MEASUREMENT-SYSTEM LENS</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">A dashboard is a management conversation—not a collection of charts</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Outcome, driver, control, risk and balancing measures work together only when</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">definitions, provenance, thresholds, ownership and response rules connect every</text><text x="70" y="250" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">signal to a decision.</text><rect x="70" y="285" width="404" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">01</text><text x="98" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Outcome</text><text x="98" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Did the service promise</text><text x="98" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">hold?</text><rect x="498" y="285" width="404" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="526" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">02</text><text x="526" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Driver</text><text x="526" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">What predicts the result?</text><rect x="926" y="285" width="404" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="954" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">03</text><text x="954" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Control</text><text x="954" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Is the process within</text><text x="954" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">limits?</text><rect x="70" y="500" width="404" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">04</text><text x="98" y="588" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Risk + balance</text><text x="98" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">What harm or trade-off is</text><text x="98" y="655" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">emerging?</text><rect x="498" y="500" width="404" height="185" rx="18" fill="#071A32" stroke="#C79A43" stroke-width="3"/><text x="526" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">05</text><text x="526" y="588" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#fff" text-anchor="start">Action</text><text x="526" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#D7E0E9" text-anchor="start">Who investigates and</text><text x="526" y="655" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#D7E0E9" text-anchor="start">responds?</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · CONTROL THAT SURVIVES THE HANDOFF</text></svg>
