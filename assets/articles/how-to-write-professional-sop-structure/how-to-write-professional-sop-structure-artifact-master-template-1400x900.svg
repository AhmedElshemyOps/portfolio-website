<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">SOP MASTER TEMPLATE</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">The template is a control frame—not a substitute for process design</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Every section has a purpose, owner, source, review question and connected evidence</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">so the approved document remains usable and maintainable.</text><rect x="65" y="270" width="1270" height="480" rx="16" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><path d="M65 286Q65 270 81 270H1319Q1335 270 1335 286V340H65Z" fill="#071A32"/><text x="81" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">TEMPLATE BLOCK</text><text x="361" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">DESIGN QUESTION</text><text x="921" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">RELEASE EVIDENCE</text><text x="81" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Identity and scope</text><text x="361" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Which process, version and boundary?</text><text x="921" y="378" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Approved control data</text><path d="M65 422H1335" stroke="#DED5C4"/><text x="81" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Roles and inputs</text><text x="361" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Who acts with what current source?</text><text x="921" y="460" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Authority + readiness</text><path d="M65 504H1335" stroke="#DED5C4"/><text x="81" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Procedure and</text><text x="81" y="563" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">exceptions</text><text x="361" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">How does normal and disrupted work flow?</text><text x="921" y="542" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Tested sequence</text><path d="M65 586H1335" stroke="#DED5C4"/><text x="81" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Communication and</text><text x="81" y="645" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">records</text><text x="361" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">What is shared and retained?</text><text x="921" y="624" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Traceable evidence</text><path d="M65 668H1335" stroke="#DED5C4"/><text x="81" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Measures and</text><text x="81" y="727" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">governance</text><text x="361" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">How is effectiveness reviewed and changed?</text><text x="921" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Owner + revision route</text><path d="M65 750H1335" stroke="#DED5C4"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · ANALYSIS BEFORE SOP DESIGN</text></svg>
