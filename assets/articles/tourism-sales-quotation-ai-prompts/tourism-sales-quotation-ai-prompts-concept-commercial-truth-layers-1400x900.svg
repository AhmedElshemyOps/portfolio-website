<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1070 0H1400V330Z" fill="#E8DDC7" opacity=".78"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">COMMERCIAL MODEL</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="42" font-weight="750" fill="#071A32" text-anchor="start">Three layers of a controlled proposal</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">Persuasive communication remains safe when it is built around approved commercial</text><text x="70" y="220" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667E" text-anchor="start">truth and explicit authority.</text><rect x="120" y="300" width="1160" height="130" rx="20" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><text x="175" y="355" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="800" fill="#8B6418" text-anchor="start">01</text><text x="245" y="355" font-family="IBM Plex Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#071A32" text-anchor="start">APPROVED COMMERCIAL FACTS</text><text x="245" y="395" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#52667E" text-anchor="start">Costing output · rate sheet · inclusions · exclusions · validity · terms</text><path d="M700 430V475" stroke="#C79A43" stroke-width="6"/><rect x="190" y="475" width="1020" height="130" rx="20" fill="#F7F2E8" stroke="#C79A43" stroke-width="3"/><text x="245" y="530" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="800" fill="#8B6418" text-anchor="start">02</text><text x="315" y="530" font-family="IBM Plex Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#071A32" text-anchor="start">CLIENT-SPECIFIC NARRATIVE</text><text x="315" y="570" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#52667E" text-anchor="start">Clear value, programme, conditions and next step — without changing</text><text x="315" y="598" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#52667E" text-anchor="start">the controlled facts</text><path d="M700 605V650" stroke="#C79A43" stroke-width="6"/><rect x="330" y="650" width="740" height="110" rx="20" fill="#071A32"/><text x="385" y="715" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="800" fill="#DFC27D" text-anchor="start">03</text><text x="455" y="715" font-family="IBM Plex Sans, Arial, sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="start">HUMAN COMMERCIAL RELEASE</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">AHMED MAHMOUD · TOURISM OPERATIONS</text></svg>
