<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">PROFESSIONAL METHOD</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">The lifecycle moves from value to verified improvement</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The method maps real work, identifies risk and variation, designs proportionate</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">controls, governs the document pack, validates use and returns evidence to the next</text><text x="70" y="250" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">cycle.</text><rect x="70" y="225" width="232.8" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="270" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">01</text><text x="98" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Define value</text><text x="98" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Outcome + accountable</text><text x="98" y="380" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">boundary</text><rect x="326.8" y="225" width="232.8" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="354.8" y="270" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">02</text><text x="354.8" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Map work</text><text x="354.8" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Flow, interfaces + records</text><rect x="583.6" y="225" width="232.8" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="611.6" y="270" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">03</text><text x="611.6" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Identify risk</text><text x="611.6" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Failure, cause + control</text><text x="611.6" y="380" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">need</text><rect x="840.4000000000001" y="225" width="232.8" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="868.4000000000001" y="270" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">04</text><text x="868.4000000000001" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Measure</text><text x="868.4000000000001" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Baseline + variation</text><rect x="1097.2" y="225" width="232.8" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="1125.2" y="270" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">05</text><text x="1125.2" y="313" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Design</text><text x="1125.2" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Process, authority +</text><text x="1125.2" y="380" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">resilience</text><rect x="70" y="440" width="232.8" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">06</text><text x="98" y="528" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Govern</text><text x="98" y="575" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">SOP pack + document control</text><rect x="326.8" y="440" width="232.8" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="354.8" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">07</text><text x="354.8" y="528" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Validate</text><text x="354.8" y="575" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Pilot, STP + defects</text><rect x="583.6" y="440" width="232.8" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="611.6" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">08</text><text x="611.6" y="528" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Deploy</text><text x="611.6" y="575" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Competence, release +</text><text x="611.6" y="595" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">support</text><rect x="840.4000000000001" y="440" width="232.8" height="185" rx="18" fill="#071A32" stroke="#C79A43" stroke-width="3"/><text x="868.4000000000001" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">09</text><text x="868.4000000000001" y="528" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#fff" text-anchor="start">Improve</text><text x="868.4000000000001" y="575" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#D7E0E9" text-anchor="start">KPI, audit + CAPA</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · IMPROVEMENT UNDER CONTROL</text></svg>
