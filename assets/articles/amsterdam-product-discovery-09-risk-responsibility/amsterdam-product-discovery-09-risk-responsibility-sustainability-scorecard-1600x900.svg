<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Destination responsibility scorecard</title><desc id="desc">Four measured pillars cover destination, social, environmental and economic responsibility without relying on unsupported sustainability language.</desc><rect width="1600" height="900" fill="#f5f1e8"/><text x="72" y="95" fill="#8b6418" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">DESTINATION RESPONSIBILITY · MEASUREMENT SYSTEM</text><text x="72" y="185" fill="#071a32" font-family="Georgia,serif" font-size="55" font-weight="700">Measure the footprint on the city.</text><g font-family="Arial,sans-serif"><g transform="translate(72 300)"><rect width="340" height="350" fill="#071a32"/><text x="28" y="58" fill="#dfc27d" font-size="17" font-weight="700">DESTINATION</text><text x="28" y="122" fill="#fff" font-size="28" font-weight="700">Pressure and place</text><text x="28" y="180" fill="#dbe5ef" font-size="19">Complaints</text><text x="28" y="218" fill="#dbe5ef" font-size="19">Obstruction</text><text x="28" y="256" fill="#dbe5ef" font-size="19">Dispersed interpretation</text></g><g transform="translate(444 300)"><rect width="340" height="350" fill="#fff" stroke="#c9b98f" stroke-width="2"/><text x="28" y="58" fill="#8b6418" font-size="17" font-weight="700">SOCIAL</text><text x="28" y="122" fill="#071a32" font-size="28" font-weight="700">Access and dignity</text><text x="28" y="180" fill="#52647a" font-size="19">Adjustments handled</text><text x="28" y="218" fill="#52647a" font-size="19">Expectation accuracy</text><text x="28" y="256" fill="#52647a" font-size="19">Cultural integrity</text></g><g transform="translate(816 300)"><rect width="340" height="350" fill="#fff" stroke="#c9b98f" stroke-width="2"/><text x="28" y="58" fill="#8b6418" font-size="17" font-weight="700">ENVIRONMENTAL</text><text x="28" y="122" fill="#071a32" font-size="28" font-weight="700">Operational footprint</text><text x="28" y="180" fill="#52647a" font-size="19">Motorised kilometres</text><text x="28" y="218" fill="#52647a" font-size="19">Single-use materials</text><text x="28" y="256" fill="#52647a" font-size="19">Tour-generated litter</text></g><g transform="translate(1188 300)"><rect width="340" height="350" fill="#c79a43"/><text x="28" y="58" fill="#071a32" font-size="17" font-weight="700">ECONOMIC</text><text x="28" y="122" fill="#071a32" font-size="28" font-weight="700">Fair local value</text><text x="28" y="180" fill="#071a32" font-size="19">Local delivery spend</text><text x="28" y="218" fill="#071a32" font-size="19">Positive contribution</text><text x="28" y="256" fill="#071a32" font-size="19">Supplier payment timing</text></g></g><rect x="72" y="726" width="1456" height="90" fill="#fff" stroke="#c9b98f" stroke-width="2"/><text x="800" y="782" text-anchor="middle" fill="#071a32" font-family="Georgia,serif" font-size="26" font-weight="700">Design intention → pilot metric → evidence period → approved claim</text></svg>
