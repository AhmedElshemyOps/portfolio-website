<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Amsterdam Layers responsible operation framework</title><desc id="desc">A controlled decision gate balances regulation, accessibility, safety and destination responsibility before pilot operation.</desc><rect width="1600" height="900" fill="#f5f1e8"/><rect x="0" y="0" width="1600" height="95" fill="#071a32"/><text x="72" y="60" fill="#dfc27d" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">AMSTERDAM PRODUCT DISCOVERY · ARTICLE 09</text><text x="72" y="205" fill="#071a32" font-family="Georgia,serif" font-size="58" font-weight="700">Responsible operation is a gate.</text><text x="72" y="255" fill="#52647a" font-family="Arial,sans-serif" font-size="23">Compliance alone is not enough. Every claim needs a control and evidence.</text><g font-family="Arial,sans-serif"><g transform="translate(72 350)"><rect width="310" height="250" fill="#fff" stroke="#c9b98f" stroke-width="2"/><text x="28" y="52" fill="#8b6418" font-size="17" font-weight="700">01 · REGULATION</text><text x="28" y="108" fill="#071a32" font-size="25" font-weight="700">Permit and conduct</text><text x="28" y="151" fill="#52647a" font-size="18">Verified rules</text><text x="28" y="183" fill="#52647a" font-size="18">Route-zone check</text></g><g transform="translate(405 350)"><rect width="310" height="250" fill="#fff" stroke="#c9b98f" stroke-width="2"/><text x="28" y="52" fill="#8b6418" font-size="17" font-weight="700">02 · ACCESSIBILITY</text><text x="28" y="108" fill="#071a32" font-size="25" font-weight="700">Journey validation</text><text x="28" y="151" fill="#52647a" font-size="18">Adjustment process</text><text x="28" y="183" fill="#52647a" font-size="18">Field audit required</text></g><g transform="translate(738 350)"><rect width="310" height="250" fill="#fff" stroke="#c9b98f" stroke-width="2"/><text x="28" y="52" fill="#8b6418" font-size="17" font-weight="700">03 · SAFETY</text><text x="28" y="108" fill="#071a32" font-size="25" font-weight="700">Dynamic control</text><text x="28" y="151" fill="#52647a" font-size="18">Check · switch · log</text><text x="28" y="183" fill="#52647a" font-size="18">Guide authority</text></g><g transform="translate(1071 350)"><rect width="310" height="250" fill="#fff" stroke="#c9b98f" stroke-width="2"/><text x="28" y="52" fill="#8b6418" font-size="17" font-weight="700">04 · DESTINATION</text><text x="28" y="108" fill="#071a32" font-size="25" font-weight="700">Measured impact</text><text x="28" y="151" fill="#52647a" font-size="18">Resident value</text><text x="28" y="183" fill="#52647a" font-size="18">No unsupported claims</text></g></g><path d="M382 475h23m310 0h23m310 0h23" stroke="#c79a43" stroke-width="5"/><rect x="470" y="700" width="660" height="108" fill="#071a32"/><text x="800" y="744" fill="#dfc27d" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">OPERATING DECISION</text><text x="800" y="782" fill="#fff" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700">CONTROLLED PILOT ONLY AFTER BLOCKERS CLOSE</text></svg>
