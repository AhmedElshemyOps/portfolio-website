<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">DELAYED VEHICLE</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">One verified event produces aligned audience messages</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The guest receives clear action and timing while the client receives operational</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">impact, decision status and the same controlled next-update promise.</text><rect x="95" y="335" width="215" height="250" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><circle cx="130" cy="380" r="21" fill="#071A32"/><text x="130" y="387" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">01</text><text x="115" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="750" fill="#071A32" text-anchor="start">Verify</text><text x="115" y="475" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">Vehicle delay,</text><text x="115" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">location + ETA</text><path d="M310 461H345" stroke="#C79A43" stroke-width="5"/><path d="M330 447L345 461L330 475" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="345" y="335" width="215" height="250" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><circle cx="380" cy="380" r="21" fill="#071A32"/><text x="380" y="387" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">02</text><text x="365" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="750" fill="#071A32" text-anchor="start">Authorize</text><text x="365" y="475" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">Replacement and</text><text x="365" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">communication role</text><path d="M560 461H595" stroke="#C79A43" stroke-width="5"/><path d="M580 447L595 461L580 475" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="595" y="335" width="215" height="250" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><circle cx="630" cy="380" r="21" fill="#071A32"/><text x="630" y="387" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">03</text><text x="615" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="750" fill="#071A32" text-anchor="start">Guest</text><text x="615" y="475" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">Clear instruction</text><text x="615" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">+ support contact</text><path d="M810 461H845" stroke="#C79A43" stroke-width="5"/><path d="M830 447L845 461L830 475" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="845" y="335" width="215" height="250" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><circle cx="880" cy="380" r="21" fill="#071A32"/><text x="880" y="387" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">04</text><text x="865" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="750" fill="#071A32" text-anchor="start">Client</text><text x="865" y="475" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">Impact, response +</text><text x="865" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">next update</text><path d="M1060 461H1095" stroke="#C79A43" stroke-width="5"/><path d="M1080 447L1095 461L1080 475" fill="none" stroke="#C79A43" stroke-width="5"/><rect x="1095" y="335" width="215" height="250" rx="18" fill="#071A32" stroke="#C79A43" stroke-width="3"/><circle cx="1130" cy="380" r="21" fill="#C79A43"/><text x="1130" y="387" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#071A32" text-anchor="middle">05</text><text x="1115" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="750" fill="#fff" text-anchor="start">Close</text><text x="1115" y="475" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#D7E0E9" text-anchor="start">Correction,</text><text x="1115" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#D7E0E9" text-anchor="start">delivery status +</text><text x="1115" y="527" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#D7E0E9" text-anchor="start">record</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · POINT-OF-WORK CONTROLS</text></svg>
