<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">AUDIT METHOD</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">The audit moves from risk-based planning to verified closure</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The auditor fixes objective and criteria, reviews prior evidence, selects a</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">defensible sample, triangulates field evidence, writes traceable findings and</text><text x="70" y="250" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">confirms effective follow-up.</text><rect x="70" y="285" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">01</text><text x="98" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Define</text><text x="98" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Objective, scope + criteria</text><rect x="391" y="285" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="419" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">02</text><text x="419" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Review risk</text><text x="419" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Changes, incidents + prior</text><text x="419" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">findings</text><rect x="712" y="285" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="740" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">03</text><text x="740" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Sample</text><text x="740" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Cases, shifts, roles +</text><text x="740" y="440" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">interfaces</text><rect x="1033" y="285" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="1061" y="330" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">04</text><text x="1061" y="373" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Fieldwork</text><text x="1061" y="420" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Interview + observe</text><rect x="70" y="500" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">05</text><text x="98" y="588" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Test</text><text x="98" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Records, performance +</text><text x="98" y="655" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">traceability</text><rect x="391" y="500" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="419" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">06</text><text x="419" y="588" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Findings</text><text x="419" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Criteria, evidence, gap +</text><text x="419" y="655" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">effect</text><rect x="712" y="500" width="297" height="185" rx="18" fill="#071A32" stroke="#C79A43" stroke-width="3"/><text x="740" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">07</text><text x="740" y="588" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#fff" text-anchor="start">Follow up</text><text x="740" y="635" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#D7E0E9" text-anchor="start">Action, due date +</text><text x="740" y="655" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#D7E0E9" text-anchor="start">effectiveness</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · IMPROVEMENT UNDER CONTROL</text></svg>
