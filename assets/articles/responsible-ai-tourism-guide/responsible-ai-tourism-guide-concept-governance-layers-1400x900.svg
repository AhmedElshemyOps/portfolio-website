-anchor="start">Collect only what is needed</text><rect x="284" y="450" width="832" height="72" rx="12" fill="#fffdfa" stroke="#c79a43" stroke-width="3"/><text x="324" y="497" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#9a6d16" text-anchor="start">03</text><text x="394" y="497" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750" fill="#071a32" text-anchor="start">Trained employees</text><text x="810" y="497" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#52667e" text-anchor="start">Know limits and escalation</text><rect x="356" y="540" width="688" height="72" rx="12" fill="#fffdfa" stroke="#c79a43" stroke-width="3"/><text x="396" y="587" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#9a6d16" text-anchor="start">04</text><text x="466" y="587" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750" fill="#071a32" text-anchor="start">Verifiable outputs</text><text x="810" y="587" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#52667e" text-anchor="start">Label sources and uncertainty</text><rect x="428" y="630" width="544" height="72" rx="12" fill="#071a32" stroke="#c79a43" stroke-width="3"/><text x="468" y="677" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#dfc27d" text-anchor="start">05</text><text x="538" y="677" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750" fill="#fff" text-anchor="start">Accountable human</text><text x="810" y="677" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#d9e0e8" text-anchor="start">Own the final decision</text><text x="1330" y="850" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#9a6d16" text-anchor="end">AHMED MAHMOUD · TOURISM OPERATIONS</text></svg>
