<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">TWO CONNECTED MAPS</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">The process map follows work; the journey map follows the guest</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The two views meet at touchpoints where backstage activity, service evidence and</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">human experience must agree.</text><rect x="70" y="300" width="570" height="370" rx="24" fill="#071A32" stroke="#C79A43" stroke-width="4"/><text x="110" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#DFC27D" text-anchor="start">PROCESS VIEW</text><text x="120" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Inputs and outputs</text><text x="120" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Roles and handoffs</text><text x="120" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Decisions and controls</text><text x="120" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Records and measures</text><rect x="760" y="300" width="570" height="370" rx="24" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="800" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#9A3E3E" text-anchor="start">GUEST VIEW</text><text x="810" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Needs and expectations</text><text x="810" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Visible touchpoints</text><text x="810" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Effort, clarity and emotion</text><text x="810" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Accessibility and recovery</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · ANALYSIS BEFORE SOP DESIGN</text></svg>
