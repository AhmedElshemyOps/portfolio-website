<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">INFORMATION BOUNDARY</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Internal cost control and client clarity belong in separate views</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The client receives a clear service and price; the company retains supplier rates,</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">assumptions, buffers and margin evidence.</text><rect x="70" y="300" width="560" height="370" rx="24" fill="#071A32" stroke="#C79A43" stroke-width="4"/><text x="110" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#DFC27D" text-anchor="start">INTERNAL CONTROL</text><text x="120" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Supplier rates + conditions</text><text x="120" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Cost classification + assumptions</text><text x="120" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Operational buffer + risk</text><text x="120" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Markup, margin + approvals</text><rect x="770" y="300" width="560" height="370" rx="24" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="810" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#071A32" text-anchor="start">CLIENT QUOTATION</text><text x="820" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Service description + itinerary</text><text x="820" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Price basis + validity</text><text x="820" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Inclusions + exclusions</text><text x="820" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Terms + contact route</text><path d="M630 490H770" stroke="#C79A43" stroke-width="5"/><path d="M755 476L770 490L755 504" fill="none" stroke="#C79A43" stroke-width="5"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · COMMERCIAL CONTROL</text></svg>
