<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">GROUP-SIZE BEHAVIOUR</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Per-person economics change as passenger count changes</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Fixed costs spread across the group while variable costs accumulate by guest;</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">conditional costs remain tied to explicit triggers.</text><path d="M150 680V290M150 680H1260" stroke="#071A32" stroke-width="4"/><path d="M190 390C420 520 730 610 1210 640" fill="none" stroke="#C79A43" stroke-width="10"/><path d="M190 625L1210 330" fill="none" stroke="#3E6B8F" stroke-width="10"/><path d="M190 560H1210" stroke="#9A3E3E" stroke-width="7" stroke-dasharray="18 16"/><text x="210" y="355" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#8B6418" text-anchor="start">FIXED COST PER GUEST</text><text x="870" y="310" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#3E6B8F" text-anchor="start">TOTAL VARIABLE COST</text><text x="860" y="540" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#9A3E3E" text-anchor="start">CONDITIONAL TRIGGER</text><text x="1240" y="730" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#071A32" text-anchor="end">PASSENGER COUNT →</text><text x