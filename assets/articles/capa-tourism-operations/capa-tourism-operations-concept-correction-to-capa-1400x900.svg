<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">CAPA CONTROL LOGIC</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Correction restores service; CAPA prevents a verified cause from recurring</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Event, containment, correction, investigation, corrective action, preventive reach</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">and effectiveness remain distinct so urgent recovery does not become premature</text><text x="70" y="250" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">closure.</text><rect x="70" y="330" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="98" y="375" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">01</text><text x="98" y="418" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Signal</text><text x="98" y="465" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Incident, audit, complaint</text><text x="98" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">or trend</text><rect x="391" y="330" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="419" y="375" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">02</text><text x="419" y="418" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Contain + correct</text><text x="419" y="465" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Protect the live service now</text><rect x="712" y="330" width="297" height="185" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="740" y="375" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#8B6418" text-anchor="start">03</text><text x="740" y="418" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#071A32" text-anchor="start">Corrective action</text><text x="740" y="465" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">Remove or control verified</text><text x="740" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#52667E" text-anchor="start">cause</text><rect x="1033" y="330" width="297" height="185" rx="18" fill="#071A32" stroke="#C79A43" stroke-width="3"/><text x="1061" y="375" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">04</text><text x="1061" y="418" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#fff" text-anchor="start">Effectiveness</text><text x="1061" y="465" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#D7E0E9" text-anchor="start">Independent evidence decides</text><text x="1061" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" font-weight="500" fill="#D7E0E9" text-anchor="start">closure</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · EVIDENCE BECOMES ORGANIZATIONAL LEARNING</text></svg>
