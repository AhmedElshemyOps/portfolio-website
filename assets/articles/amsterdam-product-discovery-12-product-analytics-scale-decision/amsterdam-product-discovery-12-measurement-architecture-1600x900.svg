<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F7F3EA"/><rect x="48" y="48" width="1504" height="804" rx="28" fill="#FFFFFF" stroke="#D9CDB8" stroke-width="3"/><rect x="48" y="48" width="1504" height="12" rx="6" fill="#C99A3D"/><text x="96" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#C99A3D" text-anchor="start">MEASUREMENT ARCHITECTURE</text><text x="96" y="190" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#071A32" text-anchor="start">One departure ID connects every result</text><text x="96" y="238" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">Acquisition, attendance, customer value, operations, economics and destination evidence stay joined to</text><text x="96" y="270" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">the same product version.</text><rect x="95" y="345" width="205" height="220" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="121" y="387" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">01</text><text x="121" y="427" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="start">Opportunity</text><text x="121" y="465" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">Known denominator</text><rect x="335" y="345" width="205" height="220" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="361" y="387" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">02</text><text x="361" y="427" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="start">Booking</text><text x="361" y="465" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">Channel + terms</text><rect x="575" y="345" width="205" height="220" rx="18" fill="#071A32" stroke="#C99A3D" stroke-width="3"/><text x="601" y="387" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">03</text><text x="601" y="427" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="start">Attendance</text><text x="601" y="465" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#D8E0EA" text-anchor="start">Show / no-show</text><rect x="815" y="345" width="205" height="220" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="841" y="387" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">04</text><text x="841" y="427" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="start">Experience</text><text x="841" y="465" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">Value + feedback</text><rect x="1055" y="345" width="205" height="220" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="1081" y="387" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">05</text><text x="1081" y="427" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="start">Economics</text><text x="1081" y="465" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">Actual revenue + cost</text><rect x="1295" y="345" width="205" height="220" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="1321" y="387" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">06</text><text x="1321" y="427" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="start">Impact</text><text