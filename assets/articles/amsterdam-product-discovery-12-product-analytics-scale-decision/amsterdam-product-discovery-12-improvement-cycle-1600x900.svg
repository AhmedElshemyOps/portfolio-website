<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><rect width="1600" height="900" fill="#F7F3EA"/><rect x="48" y="48" width="1504" height="804" rx="28" fill="#FFFFFF" stroke="#D9CDB8" stroke-width="3"/><rect x="48" y="48" width="1504" height="12" rx="6" fill="#C99A3D"/><text x="96" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#C99A3D" text-anchor="start">CONTINUAL IMPROVEMENT</text><text x="96" y="190" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#071A32" text-anchor="start">Use the lightest method the evidence supports</text><text x="96" y="238" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">A bounded change may need PDCA; repeated verified defects may justify root cause or DMAIC after enough</text><text x="96" y="270" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#5C6D82" text-anchor="start">stable observations exist.</text><rect x="120" y="350" width="420" height="260" rx="18" fill="#071A32" stroke="#C99A3D" stroke-width="3"/><text x="146" y="392" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">01</text><text x="146" y="432" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="start">PDCA</text><text x="146" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#D8E0EA" text-anchor="start">Bounded change. Plan · run ·</text><text x="146" y="496" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#D8E0EA" text-anchor="start">check · act.</text><rect x="595" y="350" width="420" height="260" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="621" y="392" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">02</text><text x="621" y="432" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="start">ROOT CAUSE</text><text x="621" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">Severe or repeated defect.</text><text x="621" y="496" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">Verify before 5 Whys.</text><rect x="1070" y="350" width="420" height="260" rx="18" fill="#F7F3EA" stroke="#D9CDB8" stroke-width="3"/><text x="1096" y="392" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#C99A3D" text-anchor="start">03</text><text x="1096" y="432" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#071A32" text-anchor="start">DMAIC</text><text x="1096" y="470" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">Stable measurable process.</text><text x="1096" y="496" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">Only with enough</text><text x="1096" y="522" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#5C6D82" text-anchor="start">observations.</text><path d="M300 665C520 760 1080 760 1300 665" fill="none" stroke="#C99A3D" stroke-width="4" stroke-dasharray="12 10"/><text x="96" y="818" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#C99A3D" text-anchor="start">PROBLEM FIRST · METHOD SECOND · VERSION ALWAYS</text></svg>