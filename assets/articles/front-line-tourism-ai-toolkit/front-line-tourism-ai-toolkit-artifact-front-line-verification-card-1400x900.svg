<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#f7f2e8"/><path d="M0 0H1400V12H0Z" fill="#c79a43"/><path d="M1090 0H1400V310Z" fill="#eadfc9" opacity=".72"/><text x="70" y="82" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#9a6d16" text-anchor="start">POCKET ARTIFACT</text><text x="70" y="144" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="750" fill="#071a32" text-anchor="start">Front-line verification card</text><text x="70" y="188" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667e" text-anchor="start">A fast pre-service check keeps generated content inside the confirmed</text><text x="70" y="221" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500" fill="#52667e" text-anchor="start">operating picture.</text><rect x="265" y="245" width="870" height="515" rx="24" fill="#fffdfa" stroke="#c79a43" stroke-width="4"/><text x="320" y="320" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#9a6d16" text-anchor="start">BEFORE I USE THIS OUTPUT</text><rect x="325" y="355" width="34" height="34" rx="5" fill="none" stroke="#1f6f5f" stroke-width="3"/><text x="390" y="381" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#9a6d16" text-anchor="start">01</text><text x="450" y="381" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#071a32" text-anchor="start">Facts match the confirmed itinerary</text><rect x="325" y="425" width="34" height="34" rx="5" fill="none" stroke="#1f6f5f" stroke-width="3"/><text x="390" y="451" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#9a6d16" text-anchor="start">02</text><text x="450" y="451" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#071a32" text-anchor="start">Names, timings and locations are checked</text><rect x="325" y="495" width="34" height="34" rx="5" fill="none" stroke="#1f6f5f" stroke-width="3"/><text x="390" y="521" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#9a6d16" text-anchor="start">03</text><text x="450" y="521" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#071a32" text-anchor="start">No sensitive guest data is exposed</text><rect x="325" y="565" width="34" height="34" rx="5" fill="none" stroke="#1f6f5f" stroke-width="3"/><text x="390" y="591" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#9a6d16" text-anchor="start">04</text><text x="450" y="591" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#071a32" text-anchor="start">Tone fits the guest and culture</text><rect x="325" y="635" width="34" height="34" rx="5" fill="none" stroke="#1f6f5f" stroke-width="3"/><text x="390" y="661" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#9a6d16" text-anchor="start">05</text><text x="450" y="661" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#071a32" text-anchor="start">I know when and where to escalate</text><text x="700" y="725" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#071a32" text-anchor="middle">FINAL DECISION REMAINS WITH THE QUALIFIED PROFESSIONAL</text><text x="1330" y="850" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#9a6d16" text-anchor="end">AHMED MAHMOUD · TOURISM OPERATIONS</text></svg>
