ize="16" font-weight="500" fill="#071A32" text-anchor="start">Separate timestamped results</text><path d="M65 668H1315" stroke="#DED5C4"/><text x="81" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Disposition</text><text x="331" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Who decides what follows?</text><text x="901" y="706" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Defect, correction, retest +</text><text x="901" y="727" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">release</text><path d="M65 750H1315" stroke="#DED5C4"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · CONTROLLED CHANGE FROM EVIDENCE</text></svg>
