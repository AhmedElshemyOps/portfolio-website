<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">NO-SHOW FORM</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Five blocks follow the event from service identity to closure</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The operational form guides the user through current service data, search attempts,</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">authorized decision, communication and follow-up evidence.</text><rect x="95" y="335" width="215" height="250" rx="18" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><circle cx="130" cy="380" r="21" fill="#071A32"/><text x="130" y="387" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">01</text><text x="115" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="750" fill="#071A32" text-anchor="start">Service</text><text x="115" y="475" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">Reference, guest,</text><text x="115" y="501" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">pickup +</text><text x="115" y="527" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#52667E" text-anchor="start">assignment</text><path d="M310 461H345" stroke="#C79A43" stroke-width=