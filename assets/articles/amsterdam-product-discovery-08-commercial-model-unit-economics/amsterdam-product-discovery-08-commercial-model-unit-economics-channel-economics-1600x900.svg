<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Channel economics by guest count</title><desc id="d">Direct distribution reaches break-even at six guests, B2B at seven and the OTA scenario at eight.</desc><rect width="1400" height="900" fill="#f5f1e8"/><g font-family="Arial,sans-serif"><text x="70" y="95" fill="#8b6418" font-size="21" font-weight="700" letter-spacing="4">CHANNEL ECONOMICS · €55 TEST MIDPOINT</text><text x="70" y="175" fill="#07182b" font-family="Georgia,serif" font-size="54" font-weight="700">One price. Three break-even points.</text><line x1="235" y1="585" x2="1310" y2="585" stroke="#c79a43" stroke-width="4"/><text x="215" y="592" fill="#8b6418" font-size="17" text-anchor="end">BREAK EVEN</text><g text-anchor="middle"><rect x="310" y="495" width="170" height="205" fill="#c79a43"/><text x="395" y="755" fill="#07182b" font-size="24" font-weight="700">DIRECT · 6</text><rect x="620" y="430" width="170" height="270" fill="#52647a"/><text x="705" y="755" fill="#07182b" font-size="24" font-weight="700">B2B · 7</text><rect x="930" y="365" width="170" height="335" fill="#07182b"/><text x="1015" y="755" fill="#07182b" font-size="24" font-weight="700">OTA · 8</text></g><text x="70" y="835" fill="#52647a" font-size="20">Planning scenarios—not forecasts or historical performance.</text></g></svg>
