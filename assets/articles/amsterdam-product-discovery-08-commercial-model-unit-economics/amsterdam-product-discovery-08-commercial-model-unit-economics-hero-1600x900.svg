<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Amsterdam Layers commercial model</title><desc id="d">Price waterfall connecting retail price, VAT, channel cost, variable cost and departure contribution within an eight-guest capacity.</desc><rect width="1600" height="900" fill="#f5f1e8"/><path d="M0 0h1600v22H0z" fill="#c79a43"/><g font-family="Arial,sans-serif"><text x="90" y="110" fill="#8b6418" font-size="24" font-weight="700" letter-spacing="5">AMSTERDAM PRODUCT DISCOVERY · ARTICLE 08</text><text x="90" y="205" fill="#07182b" font-family="Georgia,serif" font-size="66" font-weight="700">Can the concept make money</text><text x="90" y="278" fill="#07182b" font-family="Georgia,serif" font-size="66" font-weight="700">without breaking the experience?</text><g text-anchor="middle"><rect x="90" y="375" width="285" height="250" rx="16" fill="#07182b"/><text x="232" y="445" fill="#e8c873" font-size="19">VAT-INCLUSIVE PRICE</text><text x="232" y="545" fill="#fff" font-size="62" font-weight="700">€55</text><rect x="445" y="375" width="285" height="250" rx="16" fill="#fff" stroke="#c9b98f" stroke-width="3"/><text x="588" y="445" fill="#8b6418" font-size="19">REMOVE</text><text x="588" y="515" fill="#07182b" font-size="27" font-weight="700">VAT + channel</text><text x="588" y="558" fill="#07182b" font-size="27" font-weight="700">+ guest cost</text><rect x="800" y="375" width="285" height="250" rx="16" fill="#fff" stroke="#c9b98f" stroke-width="3"/><text x="942" y="445" fill="#8b6418" font-size="19">COVER</text><text x="942" y="515" fill="#07182b" font-size="27" font-weight="700">Guide + departure</text><text x="942" y="558" fill="#07182b" font-size="27" font-weight="700">+ overhead</text><rect x="1155" y="375" width="355" height="250" rx="16" fill="#c79a43"/><text x="1332" y="455" fill="#07182b" font-size="20">DECISION GATE 4</text><text x="1332" y="545" fill="#07182b" font-size="48" font-weight="800">REVISE</text></g><path d="M382 500h55m300 0h55m300 0h55" stroke="#c79a43" stroke-width="7"/><text x="90" y="770" fill="#52647a" font-size="24">FACT ≠ ASSUMPTION ≠ HYPOTHESIS ≠ SCENARIO</text></g></svg>
