<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Commercial capacity architecture</title><desc id="d">The direct minimum viable departure is six guests, the target is seven and the hard service ceiling is eight.</desc><rect width="1400" height="900" fill="#07182b"/><g font-family="Arial,sans-serif"><text x="70" y="95" fill="#e8c873" font-size="21" font-weight="700" letter-spacing="4">CAPACITY IS A CONTROL · NOT A SALES TARGET</text><text x="70" y="180" fill="#fff" font-family="Georgia,serif" font-size="58" font-weight="700">Eight guests is the ceiling.</text><text x="70" y="242" fill="#aebccc" font-size="25">Channel mix determines whether the departure is commercially safe.</text><path d="M150 490H1250" stroke="#52647a" stroke-width="10"/><g text-anchor="middle" font-size="22" fill="#fff"><circle cx="200" cy="490" r="27" fill="#52647a"/><text x="200" y="498">1</text><circle cx="350" cy="490" r="27" fill="#52647a"/><text x="350" y="498">2</text><circle cx="500" cy="490" r="27" fill="#52647a"/><text x="500" y="498">3</text><circle cx="650" cy="490" r="27" fill="#52647a"/><text x="650" y="498">4</text><circle cx="800" cy="490" r="27" fill="#52647a"/><text x="800" y="498">5</text><circle cx="950" cy="490" r="38" fill="#c79a43"/><text x="950" y="498" fill="#07182b">6</text><circle cx="1100" cy="490" r="44" fill="#e8c873"/><text x="1100" y="498" fill="#07182b">7</text><circle cx="1250" cy="490" r="50" fill="#fff"/><text x="1250" y="498" fill="#07182b">8</text><text x="950" y="590" fill="#e8c873" font-size="18">DIRECT FLOOR</text><text x="1100" y="635" fill="#e8c873" font-size="18">TARGET</text><text x="1250" y="680" fill="#fff" font-size="18">HARD CEILING</text></g><rect x="90" y="748" width="1220" height="78" rx="12" fill="#10243b" stroke="#c79a43"/><text x="700" y="798" fill="#fff" font-size="22" text-anchor="middle">Never repair weak economics by silently increasing service capacity.</text></g></svg>
