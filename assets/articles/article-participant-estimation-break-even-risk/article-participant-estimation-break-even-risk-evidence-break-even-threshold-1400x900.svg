<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">BREAK-EVEN CONTROL</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">The threshold separates contribution from uncovered fixed cost</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The model tests passenger scenarios against current cost and selling assumptions; it</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">does not promise demand or profit.</text><path d="M140 680V290M140 680H1260" stroke="#071A32" stroke-width="4"/><path d="M180 625L1210 330" fill="none" stroke="#3E6B8F" stroke-width="10"/><path d="M180 460H1210" stroke="#C79A43" stroke-width="10"/><circle cx="750" cy="460" r="18" fill="#9A3E3E" stroke="#fff" stroke-width="6"/><text x="760" y="310" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#3E6B8F" text-anchor="start">REVENUE BY CONFIRMED PAX</text><text x="200" y="430" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#8B6418" text-anchor="start">TOTAL TOUR COST</text><text x="780" y="505" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#9A3E3E" text-anchor="start">BREAK-EVEN THRESHOLD</text><text x="1240" y="730" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="800" fill="#071A32" text-anchor="end">CONFIRMED PARTICIPANTS →</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · QUOTATION APPLICATION</text></svg>
