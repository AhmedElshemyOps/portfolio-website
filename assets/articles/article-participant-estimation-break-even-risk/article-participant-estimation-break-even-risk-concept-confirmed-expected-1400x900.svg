<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">DEMAND EVIDENCE</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Confirmed and expected participants are different planning inputs</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The forecast informs preparation; confirmed participation supports the release</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">decision. Both require a source, date and accountable owner.</text><rect x="80" y="300" width="560" height="370" rx="24" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="120" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#071A32" text-anchor="start">EXPECTED PARTICIPANTS</text><text x="130" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Forecast or interest signal</text><text x="130" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Confidence + source date</text><text x="130" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Useful for scenarios</text><text x="130" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Not a confirmed commitment</text><rect x="760" y="300" width="560" height="370" rx="24" fill="#071A32" stroke="#C79A43" stroke-width="4"/><text x="800" y="365" font-family="IBM Plex Sans, Arial, sans-serif" font-size="24" font-weight="800" fill="#DFC27D" text-anchor="start">CONFIRMED PARTICIPANTS</text><text x="810" y="435" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Recorded acceptance</text><text x="810" y="490" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Current named evidence</text><text x="810" y="545" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Used for release rules</text><text x="810" y="600" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Changes are controlled</text><path d="M640 490H760" stroke="#C79A43" stroke-width="5"/><path d="M745 476L760 490L745 504" fill="none" stroke="#C79A43" stroke-width="5"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">EXECUTIVE OPERATIONS ATLAS · QUOTATION APPLICATION</text></svg>
