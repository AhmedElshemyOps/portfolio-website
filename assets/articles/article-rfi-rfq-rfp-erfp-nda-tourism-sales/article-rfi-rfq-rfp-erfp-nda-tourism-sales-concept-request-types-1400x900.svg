<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">COMMERCIAL REQUEST TYPES</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">The request type determines the response—not the email subject line</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Teams identify the buyer stage, information need, pricing depth, solution scope,</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">channel and confidentiality before drafting a response.</text><rect x="55" y="285" width="1340" height="470" rx="16" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><path d="M55 301Q55 285 71 285H1379Q1395 285 1395 301V355H55Z" fill="#071A32"/><text x="71" y="328" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">REQUEST</text><text x="301" y="328" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">BUYER QUESTION</text><text x="821" y="328" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">DMC RESPONSE</text><text x="71" y="393" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">RFI</text><text x="301" y="393" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Who are you and what can you do?</text><text x="821" y="393" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Capability + relevant evidence</text><path d="M55 435H1395" stroke="#DED5C4"/><text x="71" y="473" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">RFQ</text><text x="301" y="473" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">What will this defined service cost?</text><text x="821" y="473" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Price + inclusions + terms</text><path d="M55 515H1395" stroke="#DED5C4"/><text x="71" y="553" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">RFP</text><text x="301" y="553" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">What complete solution do you propose?</text><text x="821" y="553" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Approach + programme + commercial offer</text><path d="M55 595H1395" stroke="#DED5C4"/><text x="71" y="633" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">eRFP</text><text x="301" y="633" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">How must the proposal be submitted?</text><text x="821" y="633" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Controlled portal submission</text><path d="M55 675H1395" stroke="#DED5C4"/><text x="71" y="713" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">NDA</text><text x="301" y="713" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">What information must be protected?</text><text x="821" y="713" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Qualified review + access control</text><path d="M55 755H1395" stroke="#DED5C4"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">DMC SALES · IDENTIFY BEFORE RESPONDING</text></svg>
