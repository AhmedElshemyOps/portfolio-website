<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">IDENTITY CONTROL</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">The voucher supports verification; it does not replace judgement</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">A controlled handoff checks the guest, booking, service, hotel, date, supplier and</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">exception route before movement begins.</text><rect x="120" y="285" width="480" height="410" rx="22" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="160" y="345" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">SERVICE VOUCHER</text><rect x="160" y="385" width="26" height="26" rx="5" fill="none" stroke="#C79A43" stroke-width="3"/><text x="205" y="406" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#18304D" text-anchor="start">Guest / booking reference</text><rect x="160" y="385" width="26" height="26" rx="5" fill="none" stroke="#C79A43" stroke-width="3"/><text x="205" y="406" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#18304D" text-anchor="start">Date + service</text><rect x="160" y="385" width="26" height="26" rx="5" fill="none" stroke="#C79A43" stroke-width="3"/><text x="205" y="406" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#18304D" text-anchor="start">Hotel / meeting point</text><rect x="160" y="385" width="26" height="26" rx="5" fill="none" stroke="#C79A43" stroke-width="3"/><text x="205" y="406" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#18304D" text-anchor="start">Pax + special notes</text><rect x="160" y="385" width="26" height="26" rx="5" fill="none" stroke="#C79A43" stroke-width="3"/><text x="205" y="406" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#18304D" text-anchor="start">Supplier / vehicle</text><rect x="160" y="385" width="26" height="26" rx="5" fill="none" stroke="#C79A43" stroke-width="3"/><text x="205" y="406" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="650" fill="#18304D" text-anchor="start">Contact + exception route</text><rect x="800" y="285" width="480" height="410" rx="22" fill="#071A32" stroke="#C79A43" stroke-width="4"/><text x="840" y="345" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="800" fill="#DFC27D" text-anchor="start">CONTROLLED HANDOFF</text><text x="850" y="405" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">01</text><text x="905" y="405" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Match identity</text><text x="850" y="457" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">02</text><text x="905" y="457" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Confirm entitlement</text><text x="850" y="509" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">03</text><text x="905" y="509" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Resolve mismatch</text><text x="850" y="561" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">04</text><text x="905" y="561" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Record owner</text><text x="850" y="613" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="800" fill="#DFC27D" text-anchor="start">05</text><text x="905" y="613" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Release to service</text><path d="M600 490H800" stroke="#C79A43" stroke-width="5"/><path d="M785 476L800 490L785 504" fill="none" stroke="#C79A43" stroke-width="5"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">TOURISM ROLES · VERIFY BEFORE MOVEMENT</text></svg>
