<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">ROLE BOUNDARIES</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Similar guest contact does not mean identical authority</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">The comparison separates the primary job, operating location and decision boundary</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">of eight common destination roles.</text><rect x="55" y="260" width="1340" height="598" rx="16" fill="#FCFAF5" stroke="#C9B98F" stroke-width="2"/><path d="M55 276Q55 260 71 260H1379Q1395 260 1395 276V330H55Z" fill="#071A32"/><text x="71" y="303" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">ROLE</text><text x="371" y="303" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">PRIMARY PURPOSE</text><text x="971" y="303" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="750" fill="#fff" text-anchor="start">BOUNDARY</text><text x="71" y="368" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Airport crew</text><text x="371" y="368" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Inside-airport status + coordination</text><text x="971" y="368" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Airport process</text><path d="M55 396H1395" stroke="#DED5C4"/><text x="71" y="434" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Gate / arrival</text><text x="71" y="455" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">controller</text><text x="371" y="434" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Flight-level verification + control</text><text x="971" y="434" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Arrival handoff</text><path d="M55 462H1395" stroke="#DED5C4"/><text x="71" y="500" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Sign support</text><text x="371" y="500" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Visibility + final wayfinding</text><text x="971" y="500" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Meeting zone</text><path d="M55 528H1395" stroke="#DED5C4"/><text x="71" y="566" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Transfer guide</text><text x="371" y="566" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Guest movement + briefing</text><text x="971" y="566" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Transfer service</text><path d="M55 594H1395" stroke="#DED5C4"/><text x="71" y="632" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Hotel representative</text><text x="371" y="632" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Stay support + recovery</text><text x="971" y="632" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Assigned guests</text><path d="M55 660H1395" stroke="#DED5C4"/><text x="71" y="698" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Travel desk</text><text x="371" y="698" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Fixed sales + service point</text><text x="971" y="698" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Desk clients</text><path d="M55 726H1395" stroke="#DED5C4"/><text x="71" y="764" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Tour leader</text><text x="371" y="764" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Activity flow + supplier timing</text><text x="971" y="764" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Programme delivery</text><path d="M55 792H1395" stroke="#DED5C4"/><text x="71" y="830" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Licensed guide</text><text x="371" y="830" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#18304D" text-anchor="start">Cultural interpretation</text><text x="971" y="830" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#071A32" text-anchor="start">Licensed guiding</text><path d="M55 858H1395" stroke="#DED5C4"/><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">TOURISM ROLES · PURPOSE, PLACE, AUTHORITY</text></svg>
