<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><rect width="1400" height="900" fill="#F4EFE5"/><path d="M0 0H1400V12H0Z" fill="#C79A43"/><path d="M1080 0H1400V320Z" fill="#E8DDC7" opacity=".8"/><text x="70" y="82" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="800" fill="#8B6418" text-anchor="start">OPERATING MODEL</text><text x="70" y="144" font-family="IBM Plex Sans, Arial, sans-serif" font-size="40" font-weight="750" fill="#071A32" text-anchor="start">Company size changes role combinations, not control needs</text><text x="70" y="188" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">Small teams may combine duties; large operations specialise them. Qualification,</text><text x="70" y="219" font-family="IBM Plex Sans, Arial, sans-serif" font-size="22" font-weight="500" fill="#52667E" text-anchor="start">authority, handoffs, workload and backup must remain explicit in both models.</text><rect x="70" y="300" width="590" height="380" rx="24" fill="#FCFAF5" stroke="#C9B98F" stroke-width="3"/><text x="110" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="800" fill="#071A32" text-anchor="start">SMALLER OPERATION</text><text x="120" y="430" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Combined roles where lawful + competent</text><text x="120" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Named decision limits</text><text x="120" y="540" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">Visible workload + backup</text><text x="120" y="595" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#18304D" text-anchor="start">One service record</text><rect x="740" y="300" width="590" height="380" rx="24" fill="#071A32" stroke="#C79A43" stroke-width="4"/><text x="780" y="360" font-family="IBM Plex Sans, Arial, sans-serif" font-size="23" font-weight="800" fill="#DFC27D" text-anchor="start">LARGER OPERATION</text><text x="790" y="430" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Specialised teams + locations</text><text x="790" y="485" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Formal handoff ownership</text><text x="790" y="540" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Shift + escalation structure</text><text x="790" y="595" font-family="IBM Plex Sans, Arial, sans-serif" font-size="19" font-weight="650" fill="#fff" text-anchor="start">Shared operating picture</text><text x="1330" y="850" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="750" fill="#8B6418" text-anchor="end">TOURISM ROLES · SCALE WITHOUT CONFUSION</text></svg>
