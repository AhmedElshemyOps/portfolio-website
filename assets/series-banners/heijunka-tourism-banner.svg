<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc"><title id="title">Heijunka: Level tourism demand without overloading your team</title><desc id="desc">Navy and teal tourism operations banner showing current versus leveled work release across six time slots, with aircraft and itinerary motifs.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071e38"/><stop offset=".58" stop-color="#0d4260"/><stop offset="1" stop-color="#137e85"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#ffd34e"/><stop offset="1" stop-color="#ffae35"/></linearGradient></defs><rect width="1600" height="440" fill="url(#bg)"/><path d="M0 355Q390 250 760 380T1600 340V440H0Z" fill="#fff" opacity=".055"/><g fill="none" stroke="#6dd4d5" stroke-width="2" opacity=".22"><path d="M950 0V440M1060 0V440M1170 0V440M1280 0V440M1390 0V440M1500 0V440"/><path d="M920 90H1600M920 180H1600M920 270H1600M920 360H1600"/></g><text x="76" y="69" fill="#7fe1db" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">LEAN MANAGEMENT  /  TOURISM OPERATIONS</text><text x="74" y="159" fill="white" font-family="Arial,sans-serif" font-size="85" font-weight="800">HEIJUNKA</text><text x="76" y="210" fill="#ffd34e" font-family="Arial,sans-serif" font-size="32" font-weight="700">LEVEL THE WORK. PROTECT THE GUEST.</text><text x="76" y="267" fill="#f2fbff" font-family="Arial,sans-serif" font-size="28">Handle peak tourism demand without</text><text x="76" y="305" fill="#f2fbff" font-family="Arial,sans-serif" font-size="28">overloading your operations team</text><rect x="74" y="342" width="605" height="55" rx="27" fill="url(#gold)"/><text x="107" y="378" fill="#08233e" font-family="Arial,sans-serif" font-size="23" font-weight="800">DMC CASE STUDY  ·  3 AI MASTER PROMPTS</text><rect x="904" y="54" width="625" height="330" rx="25" fill="#f7fbff"/><text x="945" y="98" fill="#113b58" font-family="Arial,sans-serif" font-size="24" font-weight="800">WORK RELEASE BY 30-MINUTE SLOT</text><text x="947" y="126" fill="#47667a" font-family="Arial,sans-serif" font-size="17">Current vs. leveled preparation packages</text><g stroke="#d9e4ed" stroke-width="2"><path d="M949 324H1480M949 270H1480M949 216H1480M949 162H1480"/></g><g fill="#1a638c"><rect x="972" y="288" width="26" height="36" rx="3"/><rect x="1055" y="252" width="26" height="72" rx="3"/><rect x="1138" y="216" width="26" height="108" rx="3"/><rect x="1221" y="234" width="26" height="90" rx="3"/><rect x="1304" y="270" width="26" height="54" rx="3"/><rect x="1387" y="288" width="26" height="36" rx="3"/></g><g fill="#e6ad28"><rect x="1002" y="252" width="26" height="72" rx="3"/><rect x="1085" y="252" width="26" height="72" rx="3"/><rect x="1168" y="252" width="26" height="72" rx="3"/><rect x="1251" y="252" width="26" height="72" rx="3"/><rect x="1334" y="252" width="26" height="72" rx="3"/><rect x="1417" y="288" width="26" height="36" rx="3"/></g><g fill="#29485d" font-family="Arial,sans-serif" font-size="16"><text x="966" y="349">08:00</text><text x="1049" y="349">08:30</text><text x="1132" y="349">09:00</text><text x="1215" y="349">09:30</text><text x="1298" y="349">10:00</text><text x="1381" y="349">10:30</text></g><rect x="946" y="364" width="14" height="14" rx="2" fill="#1a638c"/><text x="967" y="377" fill="#29485d" font-size="15" font-family="Arial,sans-serif">Current</text><rect x="1071" y="364" width="14" height="14" rx="2" fill="#e6ad28"/><text x="1092" y="377" fill="#29485d" font-size="15" font-family="Arial,sans-serif">Proposed</text><text x="1345" y="377" fill="#29485d" font-size="14" font-family="Arial,sans-serif">Illustrative data</text></svg>