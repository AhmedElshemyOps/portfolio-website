<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">Assignment fit scorecard</title><desc id="desc">A visual scorecard showing the weighted factors used to select the best DMC team member for an operation.</desc>
<rect width="1600" height="840" fill="#f6f9fc"/><rect x="55" y="45" width="1490" height="750" rx="30" fill="#fff" stroke="#d5e1eb" stroke-width="4"/>
<text x="110" y="118" fill="#071527" font-family="Arial,sans-serif" font-size="42" font-weight="700">Assignment Fit Scorecard</text><text x="110" y="160" fill="#4f6477" font-family="Arial,sans-serif" font-size="22">Use a transparent weighted model to support professional judgment—not replace it.</text>
<g transform="translate(110 210)" font-family="Arial,sans-serif"><rect width="900" height="510" rx="24" fill="#f8fbfe" stroke="#d5e1eb" stroke-width="3"/><rect width="900" height="58" rx="24" fill="#0c3152"/><text x="36" y="38" fill="#fff" font-size="22" font-weight="700">ASSIGNMENT FACTOR</text><text x="795" y="38" fill="#fff" font-size="22" font-weight="700">WEIGHT</text>
<g fill="#223c54" font-size="23"><text x="36" y="112">Required licence and qualifications</text><text x="36" y="170">Language match</text><text x="36" y="228">Relevant product experience</text><text x="36" y="286">Guest-profile suitability</text><text x="36" y="344">Availability and timing realism</text><text x="36" y="402">Route and destination knowledge</text><text x="36" y="460">Workload and fatigue level</text><text x="36" y="510">Previous guest feedback or quality score</text></g>
<g font-size="22" font-weight="700"><rect x="760" y="78" width="100" height="34" rx="17" fill="#f3c765"/><rect x="760" y="136" width="100" height="34" rx="17" fill="#a9d6ee"/><rect x="760" y="194" width="100" height="34" rx="17" fill="#a9d6ee"/><rect x="760" y="252" width="100" height="34" rx="17" fill="#a9d6ee"/><rect x="760" y="310" width="100" height="34" rx="17" fill="#b9e5cf"/><rect x="760" y="368" width="100" height="34" rx="17" fill="#b9e5cf"/><rect x="760" y="426" width="100" height="34" rx="17" fill="#b9e5cf"/><rect x="760" y="484" width="100" height="34" rx="17" fill="#e5eaf0"/><g fill="#071527"><text x="810" y="103" text-anchor="middle">20</text><text x="810" y="161" text-anchor="middle">15</text><text x="810" y="219" text-anchor="middle">15</text><text x="810" y="277" text-anchor="middle">15</text><text x="810" y="335" text-anchor="middle">10</text><text x="810" y="393" text-anchor="middle">10</text><text x="810" y="451" text-anchor="middle">10</text><text x="810" y="509" text-anchor="middle">5</text></g></g></g>
<g transform="translate(1060 210)" font-family="Arial,sans-serif"><rect width="385" height="510" rx="24" fill="#071527"/><text x="192" y="74" text-anchor="middle" fill="#f3c765" font-size="25" font-weight="700">EXAMPLE OUTCOME</text><text x="192" y="125" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">French VIP Family Tour</text><circle cx="192" cy="265" r="100" fill="#123a5a" stroke="#f3c765" stroke-width="7"/><text x="192" y="282" text-anchor="middle" fill="#fff" font-size="64" font-weight="700">94</text><text x="192" y="322" text-anchor="middle" fill="#b9d9ed" font-size="20">BEST-FIT SCORE / 100</text><rect x="45" y="405" width="295" height="62" rx="15" fill="#f3c765"/><text x="192" y="444" text-anchor="middle" fill="#071527" font-size="25" font-weight="700">PRIMARY GUIDE SELECTED</text><text x="192" y="500" text-anchor="middle" fill="#b9d9ed" font-size="20">Confirm briefing, readiness</text><text x="192" y="532" text-anchor="middle" fill="#b9d9ed" font-size="20">and backup before service.</text></g>
</svg>